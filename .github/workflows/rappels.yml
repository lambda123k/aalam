name: Rappels Aalam

on:
  schedule:
    # 4 h UTC : programme la fiche du jour (envoyée à 8 h, 12 h 30 ou 19 h, heure de chacun)
    - cron: "7 4 * * *"
    # 19 h UTC (21 h l'été, 20 h l'hiver à Paris) : « ta série t'attend »
    - cron: "3 19 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "jour ou serie"
        default: "jour"

jobs:
  envoyer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Envoyer
        env:
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then MODE="${{ inputs.mode }}";
          elif [ "${{ github.event.schedule }}" = "3 19 * * *" ]; then MODE=serie; else MODE=jour; fi
          node push/send.mjs "$MODE"
