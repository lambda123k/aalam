<title>Aalam</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout : la carte occupe tout l'écran ; les sections sortent d'un tiroir à gauche, la liste monte depuis un bouton en bas, un pays touché ouvre un panneau. */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --surface2:#E9EEF1; --ink:#13202A; --muted:#566771; --line:#D3DCE2;
  --sea:#5C9BCB; --sea2:#9CCAE8; --space:#E4EEF5; --space2:#FFFFFF; --glow:#9CCAE8; --grat:rgb(255 255 255 / .28); --shadeA:.22; --land:#EEF1EB; --border-land:#5C9BCB;
  --accent:#1D5BC2; --accent-ink:#FFFFFF;
  --lv4:#B42318; --lv3:#D45A1A; --lv2:#B98712; --lv1:#6650B8;
  --al1:#2A66D6; --al2:#14907F; --al3:#C14E25;
  --secL:34%; --secLit:50%;
  --shadow:0 10px 30px rgb(19 32 42 / .18); --shadow-s:0 3px 12px rgb(19 32 42 / .14);
  --lv4-g:#FF5A4E; --lv3-g:#FF9142; --lv2-g:#F2C14E; --lv1-g:#A78BFA; --al1-g:#5B9BFF; --al2-g:#35D3BC; --al3-g:#FF8A5B;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C1318; --surface:#131C22; --surface2:#1B262D; --ink:#E5EBEE; --muted:#93A3AC; --line:#26333B;
  --sea:#0B2A47; --sea2:#1A4C78; --space:#05090E; --space2:#0E1A27; --glow:#3F86C9; --grat:rgb(255 255 255 / .07); --shadeA:.45; --land:#22333F; --border-land:#0B2A47;
  --accent:#78A6FF; --accent-ink:#0C1318;
  --lv4:#FF6A5C; --lv3:#FF9548; --lv2:#E9BC45; --lv1:#A898FF;
  --al1:#6A9BFF; --al2:#3CC8B4; --al3:#FF8A5B;
  --secL:74%; --secLit:60%; --shadow:0 10px 30px rgb(0 0 0 / .55); --shadow-s:0 3px 12px rgb(0 0 0 / .45); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0C1318; --surface:#131C22; --surface2:#1B262D; --ink:#E5EBEE; --muted:#93A3AC; --line:#26333B;
  --sea:#0B2A47; --sea2:#1A4C78; --space:#05090E; --space2:#0E1A27; --glow:#3F86C9; --grat:rgb(255 255 255 / .07); --shadeA:.45; --land:#22333F; --border-land:#0B2A47;
  --accent:#78A6FF; --accent-ink:#0C1318;
  --lv4:#FF6A5C; --lv3:#FF9548; --lv2:#E9BC45; --lv1:#A898FF;
  --al1:#6A9BFF; --al2:#3CC8B4; --al3:#FF8A5B;
  --secL:74%; --secLit:60%; --shadow:0 10px 30px rgb(0 0 0 / .55); --shadow-s:0 3px 12px rgb(0 0 0 / .45); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%; background:#03060d}
body{color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased; overflow:hidden}
a{color:var(--accent)}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
h1,h2,h3{font-family:var(--f-display); text-wrap:balance; margin:0; letter-spacing:-.01em}
.mono{font-family:var(--f-mono); font-size:.74rem; letter-spacing:.02em}
.eyebrow{font-family:var(--f-mono); font-size:.68rem; text-transform:uppercase; letter-spacing:.09em; color:var(--muted)}
.badge{font-family:var(--f-mono); font-size:.66rem; letter-spacing:.04em; padding:3px 8px; border-radius:20px; background:var(--surface2); color:var(--muted); white-space:nowrap; flex:none}
.sw{display:inline-block; width:10px; height:10px; border-radius:3px; background:hsl(var(--h) 65% var(--secLit)); flex:none}
.cardish{background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow-s)}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation-duration:.01ms!important; transition-duration:.01ms!important} }

/* Carte */
.stage{position:fixed; inset:0; background:#03060d; touch-action:none; user-select:none; -webkit-user-select:none; overflow:hidden}
.stage canvas{position:absolute; inset:0; display:block}
#twinkle{position:absolute; inset:0; pointer-events:none; overflow:hidden}
#twinkle i{position:absolute; width:2px; height:2px; border-radius:50%; background:#fff; box-shadow:0 0 6px 1px rgb(180 210 255 / .8); opacity:.15; animation:twinkle 4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.12; transform:scale(.6)}50%{opacity:1; transform:scale(1.2)}}
.shoot{position:absolute; width:120px; height:1.5px; background:linear-gradient(90deg, rgb(255 255 255 / 0), rgb(220 235 255 / .95)); border-radius:2px; opacity:0; transform:rotate(-28deg); animation:shoot 17s linear infinite}
@keyframes shoot{0%{opacity:0; translate:0 0}1%{opacity:1}5%{opacity:0; translate:260px 140px}100%{opacity:0; translate:260px 140px}}
.stage svg{position:absolute; inset:0; display:block; width:100%; height:100%; cursor:grab}
.stage svg.drag{cursor:grabbing}
.country{fill:var(--land); stroke:var(--border-land); stroke-width:.6; vector-effect:non-scaling-stroke; transition:fill .35s var(--ease), fill-opacity .35s var(--ease)}
.country.lit{cursor:pointer}
.country.ata{pointer-events:none}
#grat{fill:none; stroke:var(--grat); stroke-width:.6}
.o1{stop-color:var(--sea2)} .o2{stop-color:var(--sea)}
.g0{stop-color:var(--glow); stop-opacity:0} .g1{stop-color:var(--glow); stop-opacity:.55}
.s0{stop-color:#000; stop-opacity:0} .s1{stop-color:#000; stop-opacity:var(--shadeA)}
.country.sel{stroke:var(--ink); stroke-width:1.8}
.mk{cursor:pointer}
.mk .halo{opacity:.28}
.mk .core{stroke:#fff; vector-effect:non-scaling-stroke; stroke-width:1.5}
.pulse{animation:pulse 2.4s ease-out infinite; transform-box:fill-box; transform-origin:center}
@keyframes pulse{0%{transform:scale(1); opacity:.5}100%{transform:scale(2.6); opacity:0}}
.strait rect{fill:#0b1830; stroke:#fff; vector-effect:non-scaling-stroke; stroke-width:1.2}

/* Commandes flottantes */
.fl{position:fixed; z-index:10}
.secBtn{top:calc(12px + env(safe-area-inset-top,0px)); left:calc(14px + env(safe-area-inset-left,0px)); right:calc(14px + env(safe-area-inset-right,0px)); display:flex; flex-direction:column; align-items:flex-start; gap:2px; padding:0; border:0; background:none; cursor:pointer; text-align:left; pointer-events:none}
.secBtn > *{pointer-events:auto}
.secBtn, .tools, .zoom, .explore{transition:opacity .3s var(--ease)}
body.modesOn .secBtn, body.modesOn .tools, body.modesOn .zoom, body.modesOn .explore{opacity:0; pointer-events:none!important}
body.modesOn .secBtn > *{pointer-events:none}
.secBtn .brand{height:46px; display:flex; align-items:center; gap:9px; color:#fff}
.secBtn .brand svg{width:30px; height:30px; flex:none; filter:drop-shadow(0 0 8px hsl(var(--h) 80% 60% / .55))}
.secBtn .brand svg .needle{transform-origin:16px 16px; animation:needle 6s ease-in-out infinite}
@keyframes needle{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(12deg)}}
.secBtn .brand span{font-family:var(--f-display); font-weight:800; font-size:1.18rem; letter-spacing:-.01em}
.secBtn .ttl{display:flex; align-items:center; gap:10px; margin-top:6px; max-width:100%}
.secBtn .ttl b{font-family:var(--f-display); font-weight:800; font-size:2rem; line-height:1.05; color:#fff; letter-spacing:-.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:0 2px 18px rgb(0 0 0 / .6)}
.secBtn .arrow{width:30px; height:30px; border-radius:50%; background:hsl(var(--h) 65% var(--secLit)); color:#fff; display:grid; place-items:center; flex:none; box-shadow:0 0 18px hsl(var(--h) 80% 55% / .5); transition:transform .3s var(--ease)}
.secBtn .arrow svg{width:16px; height:16px}
.secBtn:hover .arrow{transform:translateX(3px)}
.secBtn .meta{display:flex; align-items:center; gap:10px; margin-top:6px; font-family:var(--f-mono); font-size:.74rem; color:rgb(225 235 245 / .78); text-shadow:0 1px 8px rgb(0 0 0 / .7)}
.secBtn .meta .dot{width:7px; height:7px; border-radius:50%; background:hsl(var(--h) 75% 60%); box-shadow:0 0 8px hsl(var(--h) 80% 60%); flex:none}
.secBtn .pbar{width:64px; height:4px; border-radius:2px; background:rgb(255 255 255 / .14); overflow:hidden; flex:none}
.secBtn .pbar i{display:block; height:100%; width:0; border-radius:2px; background:hsl(var(--h) 70% 60%); transition:width .6s var(--ease)}
.tools{top:calc(12px + env(safe-area-inset-top,0px)); right:calc(12px + env(safe-area-inset-right,0px)); display:flex; gap:8px}
.round{width:46px; height:46px; border-radius:50%; display:grid; place-items:center; cursor:pointer; position:relative}
.round svg{width:20px; height:20px}
.round.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.zoom{left:calc(12px + env(safe-area-inset-left,0px)); bottom:calc(14px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:6px}
.zoom button{width:40px; height:40px; border-radius:12px; cursor:pointer; font-size:18px; line-height:1}
.layersPop{top:calc(66px + env(safe-area-inset-top,0px)); right:calc(12px + env(safe-area-inset-right,0px)); border-radius:16px; padding:10px; display:flex; flex-direction:column; gap:4px; min-width:190px; animation:pop .2s var(--ease)}
.layersPop h3{font-size:.68rem; font-family:var(--f-mono); text-transform:uppercase; letter-spacing:.09em; color:var(--muted); font-weight:500; padding:2px 6px 6px}
.lyr{display:flex; align-items:center; gap:10px; padding:8px; border-radius:10px; border:0; background:none; cursor:pointer; text-align:left}
.lyr:hover{background:var(--surface2)}
.lyr i{width:12px; height:12px; border-radius:50%}
.lyr .ck{margin-left:auto; width:18px; height:18px; border-radius:6px; border:1.5px solid var(--line); display:grid; place-items:center; font-size:12px}
.lyr[aria-pressed="true"] .ck{background:var(--ink); border-color:var(--ink); color:var(--bg)}
@keyframes pop{from{transform:translateY(-6px) scale(.98); opacity:0}to{transform:none; opacity:1}}

/* Bouton Explorer */
.explore{left:50%; bottom:calc(14px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); display:flex; align-items:center; gap:12px; padding:8px 8px 8px 16px; border-radius:28px; cursor:pointer; max-width:calc(100% - 130px); animation:rise .4s var(--ease)}
.explore .txt{display:flex; flex-direction:column; line-height:1.2; text-align:left; min-width:0}
.explore .txt b{font-family:var(--f-display); font-size:1rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.explore .txt span{font-size:.76rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.explore .go{flex:none; height:38px; padding:0 14px; border-radius:20px; background:hsl(var(--h) 65% var(--secLit)); color:#fff; display:flex; align-items:center; gap:6px; font-weight:700; font-size:.88rem}
.explore .go svg{width:16px; height:16px}
@keyframes rise{from{transform:translate(-50%, 20px); opacity:0}to{transform:translateX(-50%); opacity:1}}
.toast{left:50%; transform:translateX(-50%); top:calc(68px + env(safe-area-inset-top,0px)); background:var(--ink); color:var(--bg); border-radius:12px; padding:8px 12px; font-size:.86rem; max-width:calc(100% - 32px); text-align:center}
.rotate{left:50%; transform:translateX(-50%); bottom:calc(76px + env(safe-area-inset-bottom,0px)); background:var(--ink); color:var(--bg); border-radius:14px; padding:9px 10px 9px 14px; display:flex; gap:10px; align-items:center; font-size:.85rem; width:max-content; max-width:calc(100% - 32px)}
.rotate svg{width:20px; height:20px; flex:none}
.rotate button{background:none; border:0; color:inherit; font-size:18px; cursor:pointer}

/* Tiroir des sections */
.scrim{position:fixed; inset:0; background:rgb(5 10 14 / .4); z-index:30; opacity:0; pointer-events:none; transition:opacity .3s var(--ease)}
.scrim.show{opacity:1; pointer-events:auto}
.drawer{position:fixed; z-index:31; top:0; bottom:0; left:0; width:min(340px, 86vw); background:var(--surface); box-shadow:var(--shadow); transform:translateX(-104%); transition:transform .34s var(--ease); display:flex; flex-direction:column; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); padding-left:env(safe-area-inset-left,0px)}
.drawer.open{transform:none}
.dHead{display:flex; align-items:center; gap:10px; padding:16px 16px 10px}
.dHead svg.logo{width:28px; height:28px}
.dHead b{font-family:var(--f-display); font-weight:800; font-size:1.2rem; flex:1}
.close{flex:none; width:36px; height:36px; border-radius:50%; border:0; background:var(--surface2); cursor:pointer; font-size:18px; display:grid; place-items:center}
.close svg{width:18px; height:18px}
.dList{overflow:auto; padding:4px 10px 16px; display:flex; flex-direction:column; gap:4px}
.dItem{display:grid; grid-template-columns:auto 1fr auto; gap:4px 12px; align-items:center; text-align:left; padding:11px 12px; border-radius:14px; border:0; background:none; cursor:pointer; opacity:0; transform:translateX(-12px)}
.drawer.open .dItem{animation:slideIn .35s var(--ease) forwards; animation-delay:calc(var(--i) * 28ms + 80ms)}
@keyframes slideIn{to{opacity:1; transform:none}}
.dItem:hover{background:var(--surface2)}
.dItem[aria-current="true"]{background:hsl(var(--h) 65% var(--secLit) / .14)}
.dItem .sw{width:14px; height:14px; border-radius:4px; grid-column:1; grid-row:1}
.dItem b{font-family:var(--f-display); font-size:1.02rem; grid-column:2; grid-row:1}
.dItem small{grid-column:2 / 4; grid-row:2; color:var(--muted); font-size:.8rem; line-height:1.3}
.dItem .badge{grid-column:3; grid-row:1}
.dItem .bar{grid-column:2 / 4; grid-row:3}
.bar{height:4px; border-radius:2px; background:var(--surface2); overflow:hidden; margin-top:4px; display:block}
.bar i{display:block; height:100%; background:hsl(var(--h) 65% var(--secLit)); border-radius:2px}

/* Panneau pays */
.panel{position:fixed; z-index:20; background:var(--surface); box-shadow:var(--shadow); display:flex; flex-direction:column; overflow:hidden}
@media (orientation:landscape){ .panel{top:calc(10px + env(safe-area-inset-top,0px)); right:calc(10px + env(safe-area-inset-right,0px)); bottom:calc(10px + env(safe-area-inset-bottom,0px)); width:min(380px, 44vw); border-radius:20px; border:1px solid var(--line); animation:inR .3s var(--ease)} }
@media (orientation:portrait){ .panel{left:0; right:0; bottom:0; max-height:58%; border-radius:22px 22px 0 0; animation:inB .3s var(--ease); padding-bottom:env(safe-area-inset-bottom,0px)} }
@keyframes inR{from{transform:translateX(30px); opacity:0}to{transform:none; opacity:1}}
@keyframes inB{from{transform:translateY(40px); opacity:0}to{transform:none; opacity:1}}
.pHead{padding:14px 16px 12px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:flex-start}
.pHead .t{flex:1; min-width:0}
.pHead h2{font-size:1.5rem; font-weight:800}
.pHead .eyebrow{display:flex; align-items:center; gap:6px}
.pBody{overflow:auto; padding:12px 16px 16px; display:flex; flex-direction:column; gap:16px}
.pBody h3{font-size:.68rem; font-family:var(--f-mono); text-transform:uppercase; letter-spacing:.09em; color:var(--muted); font-weight:500; margin-bottom:6px}
.stack{display:flex; flex-direction:column; gap:6px}
.stack > *{animation:fadeUp .35s var(--ease) both; animation-delay:calc(var(--i,0) * 40ms)}
@keyframes fadeUp{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
.note{color:var(--muted); font-size:.9rem; margin:0}
.tags{display:flex; flex-wrap:wrap; gap:6px}
.tag{font-size:.82rem; padding:5px 10px; border-radius:20px; background:var(--surface2); border:0}
button.tag{cursor:pointer; display:inline-flex; gap:6px; align-items:center}

/* Lignes de notion */
.nt{text-align:left; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 13px; border-radius:12px; border:1px solid var(--line); background:var(--surface); cursor:pointer; width:100%}
.nt > span:first-child{min-width:0}
.nt small{display:block; color:var(--muted); font-size:.8rem}
.nt:hover{border-color:hsl(var(--h) 60% var(--secLit))}
.nt.soon{background:transparent; border-style:dashed; color:var(--muted); cursor:default}
.nt svg{flex:none; width:16px; height:16px; color:var(--muted)}
.read{color:hsl(var(--h) 60% var(--secL)); font-family:var(--f-mono); font-size:.68rem; white-space:nowrap}

/* Liste : panneau qui monte */
.sheetList{position:fixed; z-index:25; left:0; right:0; bottom:0; top:calc(18px + env(safe-area-inset-top,0px)); background:var(--bg); border-radius:24px 24px 0 0; box-shadow:var(--shadow); transform:translateY(102%); transition:transform .42s var(--ease); display:flex; flex-direction:column; overflow:hidden}
.sheetList.open{transform:none}
.slTop{flex:none; padding:8px max(16px, env(safe-area-inset-right,0px)) 10px max(16px, env(safe-area-inset-left,0px)); background:var(--bg); touch-action:none; cursor:grab}
.handle{width:44px; height:5px; border-radius:3px; background:var(--line); margin:2px auto 10px}
.slRow{display:flex; align-items:center; gap:12px; max-width:1100px; margin:0 auto}
.slRow h1{font-size:clamp(1.5rem, 4.5vw, 2.2rem); font-weight:800; flex:1; display:flex; align-items:center; gap:10px; min-width:0}
.slRow h1 .sw{width:14px; height:14px; border-radius:4px}
.toMap{flex:none; display:flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--surface); border-radius:20px; padding:7px 12px; cursor:pointer; font-size:.88rem}
.toMap svg{width:16px; height:16px}
.slBody{flex:1; overflow:auto; padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.inner{max-width:1100px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
.intro{display:flex; flex-wrap:wrap; gap:10px 20px; align-items:center; padding-block:2px 6px}
.intro p{margin:0; color:var(--muted); max-width:60ch; flex:1 1 280px}
.prog{display:flex; align-items:center; gap:10px; flex:0 1 260px}
.prog .bar{flex:1; margin:0; height:6px; border-radius:3px}
.prog span{font-family:var(--f-mono); font-size:.74rem; color:var(--muted); white-space:nowrap}
.shelf{margin-top:22px; animation:fadeUp .45s var(--ease) both; animation-delay:calc(var(--i) * 60ms + 120ms)}
.sheetList:not(.open) .shelf{animation:none}
.shelfHead{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:10px}
.shelfHead h2{font-size:1.15rem}
.shelfHead span{font-family:var(--f-mono); font-size:.72rem; color:var(--muted); white-space:nowrap}
.track{display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; scroll-padding-left:max(16px, env(safe-area-inset-left,0px)); padding:2px max(16px, env(safe-area-inset-left,0px)) 10px; margin:0 calc(-1 * max(16px, env(safe-area-inset-left,0px))); scrollbar-width:thin}
.card{flex:0 0 min(270px, 78vw); scroll-snap-align:start; text-align:left; border-radius:18px; padding:14px; display:flex; flex-direction:column; gap:8px; cursor:pointer; min-height:150px; position:relative; transition:transform .2s var(--ease), box-shadow .2s var(--ease)}
.card:hover{transform:translateY(-3px); box-shadow:var(--shadow)}
.card .top{display:flex; justify-content:space-between; gap:8px; align-items:center}
.card h3{font-size:1.08rem; line-height:1.2}
.card p{margin:0; color:var(--muted); font-size:.88rem; line-height:1.4; flex:1; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden}
.card .foot{display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:.8rem; color:var(--muted)}
.card .foot b{color:hsl(var(--h) 60% var(--secL)); font-weight:700}
.card.ready{background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow-s); border-top:4px solid hsl(var(--h) 65% var(--secLit))}
.card.soon{background:transparent; border:1.5px dashed var(--line); cursor:default; min-height:120px}
.card.soon h3{color:var(--muted); font-weight:500}
.card.cf{border-top-color:var(--lvc)}
.lvl{display:inline-flex; align-items:center; gap:6px; font-family:var(--f-mono); font-size:.66rem; text-transform:uppercase; letter-spacing:.07em; color:var(--lvc)}
.lvl i{width:8px; height:8px; border-radius:50%; background:var(--lvc)}
.sources{margin-top:28px; color:var(--muted); font-size:.85rem}
.sources ol{padding-left:20px; margin:8px 0 0}
.sources li{margin:4px 0}
.sources a{word-break:break-word}

/* Recherche */
.searchBar{position:fixed; top:calc(10px + env(safe-area-inset-top,0px)); left:max(12px, env(safe-area-inset-left,0px)); right:max(12px, env(safe-area-inset-right,0px)); z-index:40; display:flex; gap:8px; align-items:center; max-width:640px; margin:0 auto; animation:pop .2s var(--ease)}
.searchBar input{flex:1; min-width:0; height:46px; border-radius:23px; border:1px solid var(--line); background:var(--surface); padding:0 18px; font:inherit; font-size:16px; color:var(--ink); box-shadow:var(--shadow)}
.results{position:fixed; z-index:40; top:calc(64px + env(safe-area-inset-top,0px)); left:max(12px, env(safe-area-inset-left,0px)); right:max(12px, env(safe-area-inset-right,0px)); max-width:640px; margin:0 auto; background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); max-height:calc(100% - 90px); overflow:auto; padding:6px}
.results button{display:flex; width:100%; text-align:left; gap:10px; align-items:baseline; background:none; border:0; padding:10px; border-radius:10px; cursor:pointer}
.results button:hover,.results button:focus-visible{background:var(--surface2)}
.results .rt{flex:1; min-width:0}
.results .rt strong{display:block}
.results .rt span{color:var(--muted); font-size:.86rem}
.results .empty{padding:14px; color:var(--muted)}
mark{background:color-mix(in srgb, var(--accent) 22%, transparent); color:inherit; border-radius:3px; padding:0 1px}

/* Fiche de lecture */
.modal{position:fixed; inset:0; background:rgb(5 10 14 / .45); z-index:50; display:flex; align-items:flex-end; justify-content:center; animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--surface); width:100%; max-width:680px; max-height:min(92%, 900px); overflow:auto; border-radius:24px 24px 0 0; padding:8px max(20px, env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(20px, env(safe-area-inset-left,0px)); box-shadow:var(--shadow); animation:inB .3s var(--ease)}
@media (min-width:760px), (orientation:landscape){.modal{align-items:center}.sheet{border-radius:24px; max-height:92%}}
.sheetTop{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; position:sticky; top:-8px; background:var(--surface); padding-top:8px; z-index:1}
.sheet h2{font-size:clamp(1.5rem, 5vw, 2rem); font-weight:800; margin-top:4px}
.sheet .lead{font-size:1.07rem; margin:14px 0 0; max-width:62ch}
.part{margin-top:20px; padding-top:16px; border-top:1px solid var(--line)}
.part h4{margin:0 0 6px; font-family:var(--f-mono); font-size:.68rem; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); font-weight:500}
.part p{margin:0; max-width:62ch}
.callout{background:var(--surface2); border-radius:12px; padding:12px 14px}
.facts{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; margin-top:14px; font-size:.94rem}
.facts dt{color:var(--muted); font-family:var(--f-mono); font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; padding-top:3px}
.facts dd{margin:0}
.see{display:flex; flex-wrap:wrap; gap:6px}
.see button{border:1px solid var(--line); background:var(--surface); border-radius:20px; padding:6px 12px; cursor:pointer; font-size:.88rem}
.see button:hover{border-color:var(--accent)}


/* Curseur du temps (mode replié) */
.fMini{left:12px; right:12px; bottom:calc(10px + env(safe-area-inset-bottom,0px)); margin:0 auto; max-width:640px; background:none; border:0; box-shadow:none; padding:30px 4px 4px 14px; display:flex; align-items:center; gap:12px; animation:rise .35s var(--ease); --h:32}
.mTrack{position:relative; flex:1; height:28px; touch-action:none; cursor:pointer; user-select:none; -webkit-user-select:none}
.mRail{position:absolute; left:0; right:0; top:50%; height:6px; margin-top:-3px; border-radius:3px; overflow:hidden; background:hsl(var(--h) 80% 62%); box-shadow:0 0 12px hsl(var(--h) 80% 55% / .45)}
.mRail i{position:absolute; top:0; bottom:0}
.mRail b{position:absolute; top:0; width:2px; height:6px; margin-left:-1px; background:rgb(0 0 0 / .28)}
.mThumb{position:absolute; top:50%; left:0; width:24px; height:24px; margin:-12px 0 0 -12px; border-radius:50%; background:#fff; border:3px solid hsl(var(--h) 80% 50%); box-shadow:var(--shadow-s); transition:transform .15s}
.mTrack.drag .mThumb{transform:scale(1.15)}
.mBubble{position:absolute; bottom:calc(100% + 6px); left:50%; transform:translateX(-50%); background:#fff; color:#13202A; box-shadow:0 3px 10px rgb(0 0 0 / .35); font-family:var(--f-display); font-weight:800; font-size:.95rem; padding:3px 10px; border-radius:10px; white-space:nowrap; font-variant-numeric:tabular-nums; pointer-events:none}
.mBubble::after{content:""; position:absolute; top:100%; left:50%; margin-left:-5px; border:5px solid transparent; border-top-color:#fff; border-bottom:0}
.mUp{flex:none; width:36px; height:36px; border-radius:50%; border:1px solid rgb(255 255 255 / .25); background:rgb(255 255 255 / .12); color:#fff; display:grid; place-items:center; cursor:pointer}
.mUp svg{width:18px; height:18px}
.mUp{backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px)}
.fGrip{display:block; width:100%; height:16px; margin:-8px 0 2px; border:0; background:none; cursor:pointer; padding:0}
.fGrip span{display:block; width:44px; height:5px; border-radius:3px; background:var(--line); margin:4px auto}
/* Frise chronologique */
.frise{left:50%; transform:translateX(-50%); bottom:0; width:min(760px, 100%); border-radius:22px 22px 0 0; padding:12px 0 calc(10px + env(safe-area-inset-bottom,0px)); animation:riseF .35s var(--ease); --h:32}
@keyframes riseF{from{transform:translate(-50%, 30px); opacity:0}to{transform:translateX(-50%); opacity:1}}
.fTop{display:flex; align-items:center; gap:10px; padding:0 14px 0 16px}
.fYear{flex:1; min-width:0; line-height:1.1}
.fYear b{font-family:var(--f-display); font-weight:800; font-size:1.55rem; letter-spacing:-.02em; font-variant-numeric:tabular-nums; display:block}
.fYear span{display:inline-flex; align-items:center; gap:6px; font-family:var(--f-mono); font-size:.7rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted)}
.fYear span i{width:9px; height:9px; border-radius:3px; background:var(--era)}
.fBtns{display:flex; gap:6px}
.fBtns button{width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:var(--surface2); cursor:pointer; display:grid; place-items:center; color:var(--ink)}
.fBtns button svg{width:18px; height:18px}
.fBtns button.play{background:hsl(var(--h) 70% var(--secLit)); color:#fff; border-color:transparent}
.fTrackWrap{position:relative; margin-top:10px}
.fScroll{overflow:hidden; touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none}
.fScroll::-webkit-scrollbar{display:none}
.fScroll.drag{cursor:grabbing}
.fInner{position:relative; height:126px; will-change:transform}
.fEra{position:absolute; top:20px; height:17px; border-radius:6px; background:hsl(var(--eh) 60% var(--secLit) / .22); border:1px solid hsl(var(--eh) 60% var(--secLit) / .45); font-family:var(--f-mono); font-size:.62rem; text-transform:uppercase; letter-spacing:.06em; color:hsl(var(--eh) 55% var(--secL)); display:flex; align-items:center; padding:0 8px; white-space:nowrap; overflow:hidden}
.fTick{position:absolute; top:0; transform:translateX(-50%); font-family:var(--f-mono); font-size:.62rem; color:var(--muted); white-space:nowrap}
.fTick::after{content:""; position:absolute; left:50%; top:15px; width:1px; height:6px; background:var(--line)}
.fBar{position:absolute; height:7px; border-radius:4px; background:hsl(var(--bh) 70% var(--secLit)); opacity:.5; transition:opacity .2s}
.fDot{position:absolute; top:41px; width:10px; height:10px; margin-left:-5px; border-radius:50%; background:hsl(var(--bh) 70% var(--secLit)); opacity:.5; border:2px solid var(--surface); transition:opacity .2s, transform .2s; cursor:pointer}
.fDot.on{opacity:1; transform:scale(1.25)}
.fBar{cursor:pointer}
.fBar.on{opacity:1; box-shadow:0 0 0 2px hsl(var(--bh) 70% var(--secLit) / .3)}
.fNeedle{position:absolute; left:50%; top:-6px; bottom:-4px; width:2px; margin-left:-1px; background:var(--ink); border-radius:1px; pointer-events:none; z-index:2}
.fNeedle::before{content:""; position:absolute; left:50%; top:0; transform:translateX(-50%); border:6px solid transparent; border-top-color:var(--ink); border-bottom:0}
.fFade{position:absolute; top:0; bottom:0; width:28px; pointer-events:none; z-index:1}
.fFade.l{left:0; background:linear-gradient(90deg, var(--surface), transparent)}
.fFade.r{right:0; background:linear-gradient(-90deg, var(--surface), transparent)}
.fLegend{display:flex; gap:12px; padding:2px 16px 0; font-size:.72rem; color:var(--muted); flex-wrap:wrap}
.fLegend span{display:inline-flex; align-items:center; gap:5px}
.fLegend i{width:12px; height:6px; border-radius:3px; background:hsl(var(--bh) 70% var(--secLit))}
.fNow{display:flex; gap:8px; overflow-x:auto; padding:10px 16px 2px; scrollbar-width:none; min-height:50px}
.fNow::-webkit-scrollbar{display:none}
.fNow .empty{color:var(--muted); font-size:.85rem; padding:8px 0}
.fChip{flex:none; display:flex; flex-direction:column; align-items:flex-start; gap:1px; padding:7px 12px; border-radius:14px; border:1px solid hsl(var(--bh) 60% var(--secLit) / .5); background:hsl(var(--bh) 65% var(--secLit) / .1); cursor:pointer; text-align:left; max-width:220px; animation:fadeUp .25s var(--ease) both}
.fChip b{font-size:.88rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:196px}
.fChip small{font-family:var(--f-mono); font-size:.64rem; color:hsl(var(--bh) 55% var(--secL))}
.fNote{padding:2px 16px 0; font-size:.72rem; color:var(--muted)}
body.friseOn .zoom{bottom:calc(var(--fh, 300px) + 12px)}
.fHint{position:absolute; left:50%; top:56%; transform:translate(-50%,-50%); z-index:3; display:flex; align-items:center; gap:8px; padding:7px 13px; border-radius:20px; background:var(--ink); color:var(--bg); font-size:.82rem; font-weight:700; pointer-events:none; white-space:nowrap; animation:hintSway 2.2s ease-in-out infinite}
.fHint svg{width:18px; height:18px}
@keyframes hintSway{0%,100%{transform:translate(-56%,-50%)}50%{transform:translate(-44%,-50%)}}
@media (orientation:landscape) and (max-height:520px){ .frise{padding-top:8px} .fYear b{font-size:1.3rem} .fBtns button{width:34px; height:34px} .fTrackWrap{margin-top:4px} .fInner{height:112px} .fLegend{display:none} .fNow{min-height:40px; padding-top:6px} .fChip{padding:5px 10px} body.friseOn .zoom{display:none} }
.cta{display:flex; align-items:center; gap:14px; width:100%; text-align:left; padding:14px 16px; border-radius:18px; border:1px solid hsl(var(--h) 60% var(--secLit) / .5); background:linear-gradient(110deg, hsl(var(--h) 70% var(--secLit) / .2), hsl(280 60% var(--secLit) / .14)); cursor:pointer; margin-top:16px}
.cta .ic{width:42px; height:42px; border-radius:12px; background:hsl(var(--h) 70% var(--secLit)); color:#fff; display:grid; place-items:center; flex:none}
.cta .ic svg{width:22px; height:22px}
.cta b{font-family:var(--f-display); font-size:1.05rem; display:block}
.cta small{color:var(--muted); font-size:.84rem}


/* En savoir plus */
.moreBtn{display:flex; align-items:center; gap:12px; width:100%; margin-top:18px; padding:12px 14px; border-radius:16px; border:1.5px solid hsl(var(--h) 65% var(--secLit) / .6); background:linear-gradient(110deg, hsl(var(--h) 70% var(--secLit) / .18), hsl(var(--h) 70% var(--secLit) / .05)); cursor:pointer; text-align:left; color:var(--ink)}
.moreBtn .ic{width:38px; height:38px; border-radius:12px; background:hsl(var(--h) 70% var(--secLit)); color:#fff; display:grid; place-items:center; flex:none}
.moreBtn .ic svg{width:20px; height:20px}
.moreBtn b{font-family:var(--f-display); font-size:1.02rem; display:block}
.moreBtn small{color:var(--muted); font-size:.82rem}
.moreBtn > svg{margin-left:auto; width:18px; height:18px; color:hsl(var(--h) 55% var(--secL)); flex:none}
.moreBtn:hover{border-color:hsl(var(--h) 65% var(--secLit))}
.back{display:inline-flex; align-items:center; gap:4px; border:0; background:none; color:hsl(var(--h) 55% var(--secL)); font-family:var(--f-mono); font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; cursor:pointer; padding:0; margin-bottom:2px}
.back svg{width:14px; height:14px}
.art h3{font-family:var(--f-display); font-size:1.2rem; margin:26px 0 0; display:flex; align-items:center; gap:10px}
.art h3::before{content:""; width:6px; height:22px; border-radius:3px; background:hsl(var(--h) 70% var(--secLit)); flex:none}
.art .sub{font-size:1.05rem; color:var(--muted); margin:16px 0 0; font-style:italic; max-width:64ch}
.keys{display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:8px; margin-top:18px}
.key{background:hsl(var(--h) 65% var(--secLit) / .1); border-radius:14px; padding:10px 12px}
.key b{display:block; font-family:var(--f-display); font-size:1.3rem; color:hsl(var(--h) 55% var(--secL)); line-height:1.15}
.key span{font-size:.8rem; color:var(--muted); line-height:1.3; display:block; margin-top:2px}
.debates{display:flex; flex-direction:column; gap:8px; margin-top:10px}
.debate{border:1px solid var(--line); border-radius:14px; padding:12px 14px; background:var(--surface)}
.debate b{font-family:var(--f-display); font-size:.98rem; display:block; margin-bottom:3px}
.debate p{margin:0; line-height:1.6; font-size:.96rem}
.reads{margin:8px 0 0; padding-left:20px; line-height:1.6}
.reads li{margin-top:4px}
/* Fiches v2 : lisibilité */
.sheet.tinted{padding-top:0}
.tinted .sheetTop{top:0; margin:0 -20px; padding:16px 20px 14px; background:color-mix(in srgb, hsl(var(--h) 65% var(--secLit)) 13%, var(--surface)); border-bottom:1px solid color-mix(in srgb, hsl(var(--h) 65% var(--secLit)) 28%, var(--line)); border-radius:24px 24px 0 0}
.tinted .sheetTop .eyebrow{color:hsl(var(--h) 55% var(--secL))}
.tinted .sheetTop .close{background:color-mix(in srgb, hsl(var(--h) 65% var(--secLit)) 18%, var(--surface))}
.rprog{position:absolute; left:0; right:0; bottom:-1px; height:3px; background:transparent}
.rprog i{display:block; height:100%; width:0; background:hsl(var(--h) 65% var(--secLit)); border-radius:0 2px 2px 0; transition:width .1s linear}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.chip{display:inline-flex; align-items:center; gap:5px; font-family:var(--f-mono); font-size:.7rem; letter-spacing:.02em; padding:4px 9px; border-radius:20px; background:var(--surface); color:var(--muted); border:1px solid var(--line)}
.chip svg{width:13px; height:13px}
.chip.dateChip{background:hsl(var(--h) 65% var(--secLit)); color:#fff; border-color:transparent; font-weight:500}
.chip.done{color:hsl(var(--h) 55% var(--secL))}
.txt{max-width:64ch}
.txt .chap{font-size:1.14rem; line-height:1.5; font-weight:600; margin:18px 0 0; color:var(--ink)}
.txt p{font-size:1.02rem; line-height:1.7; margin:14px 0 0; color:var(--ink)}
.txt p + p{margin-top:12px}
.dt{color:hsl(var(--h) 60% var(--secL)); background:hsl(var(--h) 65% var(--secLit) / .13); font-weight:700; padding:0 5px; border-radius:6px; white-space:nowrap; -webkit-box-decoration-break:clone; box-decoration-break:clone}
.num{font-weight:700; color:var(--ink)}
.qt{font-style:italic}
.box{margin-top:18px; border-radius:16px; padding:14px 16px 15px; border:1px solid var(--line)}
.box h4{display:flex; align-items:center; gap:8px; margin:0 0 7px; font-family:var(--f-display); font-size:.98rem; font-weight:700; letter-spacing:0; text-transform:none}
.box h4 .ic{width:26px; height:26px; border-radius:8px; display:grid; place-items:center; flex:none}
.box h4 .ic svg{width:15px; height:15px}
.box p{margin:0; line-height:1.62; max-width:64ch}
.box.ex{background:hsl(var(--h) 65% var(--secLit) / .09); border-color:hsl(var(--h) 60% var(--secLit) / .35); border-left:4px solid hsl(var(--h) 65% var(--secLit))}
.box.ex h4{color:hsl(var(--h) 55% var(--secL))}
.box.ex .ic{background:hsl(var(--h) 65% var(--secLit)); color:#fff}
.box.why{background:color-mix(in srgb, var(--accent) 8%, var(--surface)); border-color:color-mix(in srgb, var(--accent) 30%, var(--line)); border-left:4px solid var(--accent)}
.box.why h4{color:var(--accent)}
.box.why .ic{background:var(--accent); color:var(--accent-ink)}
.box.plain{background:var(--surface2); border-color:transparent}
.box.plain h4{color:var(--ink)}
.box.plain .ic{background:var(--surface); color:var(--muted)}
.box .see button{background:var(--surface); border-color:hsl(var(--h) 50% var(--secLit) / .45); display:inline-flex; align-items:center; gap:4px}
.box .see button svg{width:14px; height:14px; color:hsl(var(--h) 55% var(--secL))}
.box .see button:hover{background:hsl(var(--h) 65% var(--secLit) / .12); border-color:hsl(var(--h) 65% var(--secLit))}
.box .tags .tag{background:var(--surface)}
.tinted .facts{background:var(--surface2); border-radius:14px; padding:12px 14px; margin-top:16px}

/* ---------- Choix du mode ---------- */
.modes{position:fixed; inset:0; z-index:46; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; padding:24px max(16px, env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));
  background:linear-gradient(180deg, rgb(3 6 13 / 0) 0%, rgb(3 6 13 / .55) 38%, rgb(3 6 13 / .94) 70%); color:#E5EBEE; animation:fade .35s ease}
.modes.out{opacity:0; transition:opacity .3s ease; pointer-events:none}
.mdIn{width:100%; max-width:520px}
.mdBrand{display:flex; align-items:center; gap:10px; font-family:var(--f-display); font-weight:800; font-size:1.05rem; letter-spacing:.01em; opacity:.85}
.mdBrand svg{width:26px; height:26px}
.modes h1{font-family:var(--f-display); font-size:clamp(1.7rem, 7vw, 2.3rem); line-height:1.08; margin:12px 0 18px; font-weight:800; text-wrap:balance}
.mdCard{display:flex; align-items:center; gap:14px; width:100%; text-align:left; padding:16px; margin-top:10px; border-radius:22px; cursor:pointer; color:inherit; font:inherit;
  background:rgb(255 255 255 / .06); border:1px solid rgb(255 255 255 / .13); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); transition:transform .15s var(--ease), background .2s}
.mdCard:active{transform:scale(.98)}
.mdCard:hover{background:rgb(255 255 255 / .1)}
.mdCard .ic{width:52px; height:52px; border-radius:16px; display:grid; place-items:center; flex:none; color:#fff}
.mdCard .ic svg{width:26px; height:26px}
.mdCard b{display:block; font-family:var(--f-display); font-size:1.18rem}
.mdCard small{display:block; color:#A9B7BF; font-size:.9rem; line-height:1.4; margin-top:2px}
.mdCard > svg{margin-left:auto; width:20px; height:20px; flex:none; opacity:.6}
.mdCard.disc .ic{background:linear-gradient(140deg, #2A66D6, #35D3BC)}
.mdCard.fil .ic{background:linear-gradient(140deg, #FF5A4E, #FF9142)}
.mdMore{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px}
.mdMore button{font:inherit; font-size:.86rem; color:#E5EBEE; background:none; border:1px solid rgb(255 255 255 / .2); border-radius:20px; padding:8px 13px; cursor:pointer; display:inline-flex; align-items:center; gap:6px}
.mdMore button svg{width:14px; height:14px}

/* ---------- Flash ---------- */
.feed{position:fixed; inset:0; z-index:45; background:#070b12; color:var(--ink); animation:fade .25s ease; overflow:hidden;
  --bg:#0C1318; --surface:#131C22; --surface2:#1B262D; --ink:#E5EBEE; --muted:#93A3AC; --line:#26333B;
  --accent:#78A6FF; --accent-ink:#0C1318; --secL:74%; --secLit:60%; color-scheme:dark}
.fdStack{position:absolute; inset:0; touch-action:pan-x pan-y}
.fc{position:absolute; inset:0; transition:transform .5s cubic-bezier(.22,.9,.24,1); will-change:transform;
  background:radial-gradient(130% 55% at 50% -5%, hsl(var(--h) 55% 20%), transparent 72%), #070b12}
.fdStack.drag .fc{transition:none}
.fc.far{visibility:hidden}
.fcH{position:absolute; inset:0; display:flex; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x mandatory; overscroll-behavior-x:contain; scrollbar-width:none}
.fcH::-webkit-scrollbar{display:none}
.pane{flex:0 0 100%; width:100%; height:100%; overflow-y:auto; overscroll-behavior-y:contain; scroll-snap-align:start; scroll-snap-stop:always; display:flex; justify-content:center; scrollbar-width:none;
  padding:calc(66px + env(safe-area-inset-top,0px)) max(20px, env(safe-area-inset-right,0px)) calc(104px + env(safe-area-inset-bottom,0px)) max(20px, env(safe-area-inset-left,0px))}
.pane::-webkit-scrollbar{display:none}
.pane.p1{background:linear-gradient(180deg, hsl(var(--h) 40% 12% / .7), #070b12 40%)}
.fcIn{width:100%; max-width:620px; display:flex; flex-direction:column; margin:auto 0}
.fc .fcIn > *{opacity:0; transform:translateY(14px); transition:opacity .45s var(--ease), transform .45s var(--ease)}
.fc.in .fcIn > *{opacity:1; transform:none}
.fc.in .fcIn > :nth-child(2){transition-delay:.06s} .fc.in .fcIn > :nth-child(3){transition-delay:.12s} .fc.in .fcIn > :nth-child(n+4){transition-delay:.18s}
.fcEye{display:inline-flex; align-items:center; gap:8px; font-family:var(--f-mono); font-size:.7rem; letter-spacing:.09em; text-transform:uppercase; color:hsl(var(--h) 70% 72%)}
.fcEye i{width:8px; height:8px; border-radius:50%; background:hsl(var(--h) 75% 60%); box-shadow:0 0 10px hsl(var(--h) 75% 60%)}
.fc h2{font-family:var(--f-display); font-size:clamp(1.65rem, 7.4vw, 2.4rem); line-height:1.06; margin:10px 0 0; font-weight:800; text-wrap:balance}
.fc .chips{margin-top:12px}
.fc .txt .chap{font-size:1.16rem}
.fc .deepTag{align-self:flex-start; display:inline-flex; align-items:center; gap:7px; padding:6px 12px; border-radius:20px; background:hsl(var(--h) 70% 60%); color:#fff; font-weight:700; font-size:.8rem; margin-top:14px}
.fc .deepTag svg{width:15px; height:15px}
.fcCf .lvl{align-self:flex-start}
.deepHint, .quizBtn{display:flex; align-items:center; gap:12px; width:100%; text-align:left; font:inherit; color:inherit; margin-top:18px; padding:13px 14px; border-radius:16px; cursor:pointer;
  border:1.5px dashed hsl(var(--h) 65% 62% / .7); background:hsl(var(--h) 70% 55% / .1)}
.deepHint > svg:first-child{width:22px; height:22px; color:hsl(var(--h) 70% 70%); flex:none}
.deepHint b, .quizBtn b{display:block; font-family:var(--f-display); font-size:1rem}
.deepHint small, .quizBtn small{display:block; color:var(--muted); font-size:.82rem}
.deepHint > svg:last-child, .quizBtn > svg:last-child{margin-left:auto; width:20px; height:20px; flex:none; color:hsl(var(--h) 70% 70%)}
.quizBtn{border-style:solid; border-color:color-mix(in srgb, #FF9142 55%, transparent); background:color-mix(in srgb, #FF9142 9%, var(--surface))}
.quizBtn .ic{width:38px; height:38px; border-radius:12px; background:linear-gradient(140deg, #FF5A4E, #FF9142); color:#fff; display:grid; place-items:center; flex:none}
.quizBtn .ic svg{width:20px; height:20px}
.quizBtn > svg:last-child{color:#FF9142}
.backFiche{align-self:flex-start; font:inherit; font-size:.86rem; font-weight:700; color:var(--muted); background:none; border:0; padding:6px 0; display:inline-flex; align-items:center; gap:4px; cursor:pointer}
.backFiche svg{width:16px; height:16px}
.deepTab{position:absolute; z-index:2; right:0; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 6px 12px 8px; border:0; border-radius:14px 0 0 14px; cursor:pointer;
  background:hsl(var(--h) 70% 55%); color:#fff; font:inherit; font-weight:800; font-size:.68rem; letter-spacing:.06em; text-transform:uppercase; box-shadow:-4px 0 20px rgb(0 0 0 / .35); transition:transform .3s var(--ease), opacity .3s}
.deepTab span{writing-mode:vertical-rl; transform:rotate(180deg)}
.deepTab svg{width:16px; height:16px}
.feed:not(.deepKnown) .fc.in .deepTab{animation:tabNudge 1.8s ease-in-out 1s 3}
@keyframes tabNudge{0%,100%{transform:translateY(-50%)}50%{transform:translate(-8px, -50%)}}
.fc.onDeep .deepTab{transform:translate(110%, -50%); opacity:0; pointer-events:none}
.hDots{position:absolute; z-index:2; top:calc(54px + env(safe-area-inset-top,0px)); left:50%; transform:translateX(-50%); display:flex; gap:5px; pointer-events:none}
.hDots i{width:6px; height:6px; border-radius:3px; background:rgb(255 255 255 / .3); transition:all .3s}
.hDots i.on{width:18px; background:hsl(var(--h) 75% 65%)}
.fdTop{position:absolute; z-index:3; top:0; left:0; right:0; padding:calc(10px + env(safe-area-inset-top,0px)) max(14px, env(safe-area-inset-right,0px)) 14px max(14px, env(safe-area-inset-left,0px));
  display:flex; align-items:center; gap:12px; background:linear-gradient(#070b12 40%, rgb(7 11 18 / 0)); pointer-events:none}
.fdTop > *{pointer-events:auto}
.fdBar{flex:1; height:4px; border-radius:2px; background:rgb(255 255 255 / .14); overflow:hidden}
.fdBar i{display:block; height:100%; width:0; border-radius:2px; background:linear-gradient(90deg, #FF5A4E, #FF9142); transition:width .4s var(--ease)}
.fdLeft{font-family:var(--f-mono); font-size:.74rem; color:#A9B7BF; white-space:nowrap}
.fdX{width:40px; height:40px; border-radius:50%; border:0; background:rgb(255 255 255 / .1); color:#fff; display:grid; place-items:center; cursor:pointer; flex:none}
.fdX svg{width:20px; height:20px}
.fdAct{position:absolute; z-index:3; left:50%; transform:translateX(-50%); bottom:calc(14px + env(safe-area-inset-bottom,0px)); display:flex; gap:2px; padding:5px; border-radius:30px; max-width:calc(100% - 20px);
  background:rgb(19 28 34 / .85); border:1px solid rgb(255 255 255 / .12); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); box-shadow:0 10px 30px rgb(0 0 0 / .5)}
.fdAct button{font:inherit; font-weight:700; font-size:.82rem; color:#E5EBEE; background:none; border:0; border-radius:24px; padding:9px 12px; display:inline-flex; align-items:center; gap:6px; cursor:pointer; white-space:nowrap}
.fdAct button:hover{background:rgb(255 255 255 / .08)}
.fdAct button svg{width:18px; height:18px; flex:none}
.fdAct .fav.on{color:#FF5A6E}
.fdAct .fav.on svg{fill:currentColor; animation:heart .4s var(--ease)}
.fdAct [data-fd-quiz]{color:#FFB37A}
.fdAct [data-fd-quiz].done svg circle:last-child{fill:#FFB37A}
@keyframes heart{40%{transform:scale(1.35)}}
.fdAct.end{display:none}
@media (max-width:360px){ .fdAct button span{display:none} .fdAct button{padding:10px 14px} }
.burst{position:fixed; z-index:60; width:90px; height:90px; margin:-45px 0 0 -45px; color:#FF5A6E; pointer-events:none; animation:burst .8s var(--ease) forwards}
.burst svg{width:100%; height:100%; fill:currentColor; filter:drop-shadow(0 6px 18px rgb(255 90 110 / .6))}
@keyframes burst{0%{transform:scale(.3) rotate(-12deg); opacity:0}25%{transform:scale(1.1) rotate(4deg); opacity:1}60%{transform:scale(1) rotate(0); opacity:1}100%{transform:scale(1.15) translateY(-50px); opacity:0}}
.swipeHint{position:absolute; z-index:4; left:50%; bottom:calc(76px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); display:flex; align-items:center; gap:6px; color:#fff; font-weight:700; font-size:.82rem; padding:8px 14px; border-radius:20px; background:rgb(255 145 66 / .92); box-shadow:0 6px 20px rgb(0 0 0 / .4); white-space:nowrap; pointer-events:none; animation:hintUp 1.6s ease-in-out infinite}
.swipeHint svg{width:18px; height:18px}
@keyframes hintUp{0%,100%{transform:translate(-50%, 0)}50%{transform:translate(-50%, -7px)}}

/* fin du fil */
.fcEnd .fcIn{align-items:flex-start}
.fcEnd .big{font-size:3.4rem; line-height:1}
.endStats{display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; width:100%; margin-top:20px}
.endStats div{background:rgb(255 255 255 / .06); border:1px solid rgb(255 255 255 / .1); border-radius:16px; padding:12px}
.endStats b{display:block; font-family:var(--f-display); font-size:1.5rem}
.endStats span{font-size:.78rem; color:#A9B7BF}
.endList{margin:18px 0 0; padding:0; list-style:none; width:100%; display:flex; flex-direction:column; gap:6px}
.endList button{width:100%; text-align:left; font:inherit; color:inherit; background:rgb(255 255 255 / .04); border:1px solid rgb(255 255 255 / .08); border-radius:12px; padding:10px 12px; display:flex; align-items:center; gap:10px; cursor:pointer}
.endList i{width:8px; height:8px; border-radius:50%; background:hsl(var(--h) 75% 60%); flex:none}
.endList span:first-of-type{flex:1}
.endList .h{color:#FF5A6E}
.endList .sc{font-family:var(--f-mono); font-size:.74rem; color:#FFB37A}
.btnRow{display:flex; flex-wrap:wrap; gap:8px; margin-top:20px; width:100%}
.bigBtn{font:inherit; font-weight:700; font-size:.98rem; border-radius:16px; padding:14px 18px; cursor:pointer; border:1px solid rgb(255 255 255 / .16); background:rgb(255 255 255 / .06); color:#E5EBEE; flex:1 1 auto; display:inline-flex; align-items:center; justify-content:center; gap:8px}
.bigBtn.go{background:linear-gradient(110deg, #FF5A4E, #FF9142); border-color:transparent; color:#fff}
.bigBtn svg{width:18px; height:18px}
.bigBtn:disabled{opacity:.4; cursor:default}

/* questionnaire */
.setup{position:absolute; inset:0; overflow-y:auto; display:flex; justify-content:center;
  background:radial-gradient(120% 50% at 50% 0%, #2a1410, transparent 70%), #070b12;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(18px, env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px, env(safe-area-inset-left,0px))}
.suIn{width:100%; max-width:560px; display:flex; flex-direction:column; min-height:100%}
.suTop{display:flex; align-items:center; gap:12px}
.suTop .fdX[data-su-back]{visibility:visible}
.suDots{flex:1; display:flex; gap:6px; justify-content:center}
.suDots i{width:26px; height:4px; border-radius:2px; background:rgb(255 255 255 / .16); transition:background .3s}
.suDots i.on{background:linear-gradient(90deg, #FF5A4E, #FF9142)}
.suBody{flex:1; display:flex; flex-direction:column; justify-content:center; padding:20px 0; animation:fadeUp .35s var(--ease)}
.suBody .q{font-family:var(--f-mono); font-size:.72rem; letter-spacing:.09em; text-transform:uppercase; color:#FF9142}
.suBody h2{font-family:var(--f-display); font-size:clamp(1.6rem, 7vw, 2.1rem); line-height:1.1; margin:8px 0 18px; font-weight:800; text-wrap:balance}
.opt{display:flex; align-items:center; gap:14px; width:100%; text-align:left; font:inherit; color:inherit; padding:15px 16px; margin-top:8px; border-radius:18px; cursor:pointer;
  background:rgb(255 255 255 / .05); border:1.5px solid rgb(255 255 255 / .1); transition:border-color .2s, background .2s, transform .12s}
.opt:active{transform:scale(.985)}
.opt.on{border-color:#FF9142; background:rgb(255 145 66 / .1)}
.opt .em{font-size:1.6rem; width:34px; text-align:center; flex:none}
.opt b{display:block; font-family:var(--f-display); font-size:1.06rem}
.opt small{display:block; color:#A9B7BF; font-size:.86rem; margin-top:1px}
.secGrid{display:flex; flex-wrap:wrap; gap:8px}
.secChip{font:inherit; font-weight:700; font-size:.92rem; color:#E5EBEE; padding:11px 15px; border-radius:24px; cursor:pointer; display:inline-flex; align-items:center; gap:8px;
  background:rgb(255 255 255 / .05); border:1.5px solid rgb(255 255 255 / .12); transition:all .2s}
.secChip i{width:9px; height:9px; border-radius:50%; background:hsl(var(--h) 70% 60%)}
.secChip.on{background:hsl(var(--h) 60% 45% / .28); border-color:hsl(var(--h) 70% 62%)}
.secChip small{font-weight:500; color:#A9B7BF; font-size:.76rem}
.suFoot{position:sticky; bottom:0; padding-top:12px}
.timeGrid{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.timeGrid .opt{flex-direction:column; align-items:flex-start; gap:4px; margin:0; padding:18px 16px}
.timeGrid .opt b{font-size:1.6rem}
.suNote{color:#A9B7BF; font-size:.86rem; margin-top:14px}

/* ---------- Quiz ---------- */
.qz{padding-top:6px}
.qzProg{display:flex; gap:5px; margin-top:8px}
.qzProg i{flex:1; height:5px; border-radius:3px; background:var(--surface2)}
.qzProg i.on{background:hsl(var(--h) 65% var(--secLit) / .6)}
.qzProg i.ok{background:#2FB67C}
.qzProg i.ko{background:#E5484D}
.qzN{font-family:var(--f-mono); font-size:.72rem; color:var(--muted); margin:18px 0 0; text-transform:uppercase; letter-spacing:.08em}
.qzQ{font-family:var(--f-display); font-size:1.28rem; line-height:1.3; margin:6px 0 16px}
.qzOpts{display:flex; flex-direction:column; gap:8px}
.qzOpt{display:flex; align-items:center; gap:12px; width:100%; text-align:left; font:inherit; font-size:1rem; line-height:1.4; color:var(--ink); padding:13px 14px; border-radius:14px; border:1.5px solid var(--line); background:var(--surface); cursor:pointer; transition:border-color .2s, background .2s, transform .12s}
.qzOpt:not(:disabled):hover{border-color:hsl(var(--h) 60% var(--secLit))}
.qzOpt:not(:disabled):active{transform:scale(.985)}
.qzOpt .l{width:28px; height:28px; border-radius:9px; display:grid; place-items:center; flex:none; font-family:var(--f-mono); font-size:.8rem; font-weight:700; background:var(--surface2); color:var(--muted)}
.qzOpt:disabled{cursor:default; opacity:.55}
.qzOpt.good{opacity:1; border-color:#2FB67C; background:color-mix(in srgb, #2FB67C 14%, var(--surface))}
.qzOpt.good .l{background:#2FB67C; color:#fff}
.qzOpt.bad{opacity:1; border-color:#E5484D; background:color-mix(in srgb, #E5484D 12%, var(--surface)); animation:shake .35s}
.qzOpt.bad .l{background:#E5484D; color:#fff}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.qzFb{margin-top:14px; padding:12px 14px; border-radius:14px; line-height:1.55; background:var(--surface2)}
.qzFb.ok b{color:#2FB67C} .qzFb.ko b{color:#E5484D}
.qzEnd{text-align:center; padding:20px 0 6px}
.qzEnd .big{font-size:3.2rem}
.qzEnd .score{display:block; font-family:var(--f-display); font-size:2.6rem; margin-top:4px}
.qzEnd h3{font-family:var(--f-display); margin:4px 0 0; font-size:1.3rem}
.qzEnd p{color:var(--muted); margin:6px 0 0}
.qzEnd .btnRow{justify-content:center}
.sheet .bigBtn{border-color:var(--line); background:var(--surface2); color:var(--ink)}
.sheet .bigBtn.go{background:linear-gradient(110deg, #FF5A4E, #FF9142); color:#fff; border-color:transparent}

/* ---------- Trophées ---------- */
.achToast{position:fixed; z-index:90; left:50%; top:calc(12px + env(safe-area-inset-top,0px)); transform:translateX(-50%); display:flex; align-items:center; gap:12px; padding:9px 18px 9px 10px; border-radius:40px; cursor:pointer;
  background:linear-gradient(110deg, #2B2210, #3A2A0E); color:#FFE7B0; border:1px solid #E8B65A; box-shadow:0 10px 30px rgb(0 0 0 / .45), 0 0 24px rgb(232 182 90 / .25); font:inherit; text-align:left; animation:achIn .5s cubic-bezier(.2,1.4,.4,1)}
.achToast .m{font-size:1.6rem; width:40px; height:40px; border-radius:50%; display:grid; place-items:center; background:radial-gradient(circle at 35% 30%, #FFE7B0, #E8B65A 60%, #A7741F); flex:none}
.achToast small{display:block; font-size:.66rem; letter-spacing:.1em; text-transform:uppercase; color:#E8B65A; font-weight:700}
.achToast b{display:block; font-family:var(--f-display); font-size:1rem; color:#FFF3D6}
.achToast.out{opacity:0; transform:translate(-50%, -20px); transition:all .35s ease}
@keyframes achIn{from{opacity:0; transform:translate(-50%, -30px) scale(.9)}}
.trGrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:10px; margin-top:16px}
.tr{border:1px solid var(--line); border-radius:16px; padding:14px 12px; text-align:center; background:var(--surface); display:flex; flex-direction:column; align-items:center; gap:3px}
.tr .m{font-size:1.8rem; width:54px; height:54px; border-radius:50%; display:grid; place-items:center; background:var(--surface2); filter:grayscale(1); opacity:.45; margin-bottom:4px}
.tr.on .m{filter:none; opacity:1; background:radial-gradient(circle at 35% 30%, #FFE7B0, #E8B65A 60%, #A7741F); box-shadow:0 4px 14px rgb(232 182 90 / .4)}
.tr b{font-family:var(--f-display); font-size:.94rem}
.tr small{color:var(--muted); font-size:.76rem; line-height:1.35}
.tr .bar{width:100%; height:4px; border-radius:2px; background:var(--surface2); margin-top:6px; overflow:hidden}
.tr .bar i{display:block; height:100%; background:#E8B65A}
.tr .pv{font-family:var(--f-mono); font-size:.68rem}
.dTrophy{display:flex; align-items:center; gap:10px; margin-top:10px; padding:12px; border-radius:14px; border:1px dashed var(--line); background:none; color:var(--muted); font:inherit; font-weight:700; cursor:pointer}
.dTrophy svg{width:20px; height:20px; color:#E8B65A}
.dTrophy small{margin-left:auto; font-family:var(--f-mono); font-size:.72rem}

/* ---------- Niveaux ---------- */
.lvTag{display:inline-flex; align-items:center; gap:3px; font-family:var(--f-mono); font-size:.66rem; letter-spacing:.03em; color:var(--muted); white-space:nowrap}
.lvTag i{width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.25}
.lvTag i:last-of-type{margin-right:3px}
.lvTag.l1 i:nth-of-type(1), .lvTag.l2 i:nth-of-type(-n+2), .lvTag.l3 i{opacity:1}
.lvTag.l1{color:#2FB67C} .lvTag.l2{color:#E0A030} .lvTag.l3{color:#E5484D}
.chips .lvTag{padding:4px 9px; border-radius:20px; border:1px solid var(--line); background:var(--surface)}
.lvlBar{display:grid; grid-template-columns:1fr auto; align-items:center; gap:6px 10px; padding:10px 12px; border-radius:14px; background:var(--surface); border:1px solid var(--line); margin-top:4px}
.lvlBar .tx{grid-column:1 / -1; font-size:.86rem; color:var(--muted)}
.lvlBar .lvSwitch{white-space:nowrap; display:inline-flex; align-items:center; gap:8px; font:inherit; font-size:.84rem; font-weight:700; color:var(--ink); background:none; border:0; cursor:pointer; padding:4px 0}
.lvlBar .lvSwitch i{width:38px; height:22px; border-radius:11px; background:var(--surface2); border:1px solid var(--line); position:relative; transition:background .2s}
.lvlBar .lvSwitch i::after{content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--muted); transition:transform .2s, background .2s}
.lvlBar .lvSwitch.on i{background:hsl(var(--h) 65% var(--secLit))}
.lvlBar .lvSwitch.on i::after{transform:translateX(16px); background:#fff}
.dLv{font-family:var(--f-mono); font-size:.6rem; font-weight:500; padding:2px 6px; border-radius:8px; background:var(--surface2); color:var(--muted); vertical-align:middle; margin-left:4px; white-space:nowrap}
.dLv.l1{color:#2FB67C} .dLv.l2{color:#E0A030} .dLv.l3{color:#E5484D}
.achToast.lvUp{background:linear-gradient(110deg, #0F2A20, #123826); border-color:#2FB67C; color:#D6F5E6; box-shadow:0 10px 30px rgb(0 0 0 / .45), 0 0 24px rgb(47 182 124 / .3)}
.achToast.lvUp small{color:#5FD6A0} .achToast.lvUp b{color:#EFFFF6}
.achToast.lvUp .m{background:radial-gradient(circle at 35% 30%, #D6F5E6, #2FB67C 65%, #17734B)}
/* auto-évaluation */
.modes .evIn{position:absolute; inset:0; overflow-y:auto; display:flex; justify-content:center; padding:calc(24px + env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));
  background:radial-gradient(120% 45% at 50% 0%, #10233a, transparent 70%), rgb(3 6 13 / .96)}
.modes .evIn .mdIn{margin:auto 0}
.evSub{color:#A9B7BF; line-height:1.5; margin:-6px 0 14px; font-size:.95rem}
.evAll{display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-bottom:12px; font-size:.82rem; color:#A9B7BF}
.evAll button{font:inherit; font-size:.8rem; color:#E5EBEE; background:rgb(255 255 255 / .06); border:1px solid rgb(255 255 255 / .14); border-radius:16px; padding:5px 10px; cursor:pointer}
.evList{display:flex; flex-direction:column; gap:8px}
.evRow{padding:10px 12px; border-radius:16px; background:rgb(255 255 255 / .05); border:1px solid rgb(255 255 255 / .1)}
.evRow > b{display:flex; align-items:center; gap:8px; font-family:var(--f-display); font-size:1rem; margin-bottom:8px}
.evRow > b i{width:9px; height:9px; border-radius:50%; background:hsl(var(--h) 70% 60%)}
.evSeg{display:grid; grid-template-columns:repeat(3, 1fr); gap:5px}
.evSeg button{font:inherit; font-size:.76rem; font-weight:700; line-height:1.2; color:#C5D0D6; background:rgb(255 255 255 / .04); border:1.5px solid rgb(255 255 255 / .1); border-radius:11px; padding:7px 4px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px; transition:all .15s}
.evSeg button .d{font-size:.62rem; letter-spacing:1px; color:#7F8E97}
.evSeg button.on{background:hsl(var(--h) 60% 45% / .3); border-color:hsl(var(--h) 70% 62%); color:#fff}
.evSeg button.on .d{color:hsl(var(--h) 80% 75%)}
.evFoot{position:sticky; bottom:0; padding-top:14px; background:linear-gradient(rgb(3 6 13 / 0), rgb(3 6 13 / .96) 40%)}

/* ---------- Accueil enrichi ---------- */
.modes{justify-content:flex-start; overflow-y:auto}
.modes > .mdIn{margin-top:auto}
.mdDay{display:block; width:100%; text-align:left; font:inherit; color:inherit; cursor:pointer; margin-bottom:6px; padding:14px 16px; border-radius:20px;
  background:linear-gradient(120deg, hsl(var(--h) 60% 35% / .45), rgb(255 255 255 / .05)); border:1px solid hsl(var(--h) 70% 60% / .5)}
.mdDay .eyb{display:block; font-family:var(--f-mono); font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; color:hsl(var(--h) 80% 78%)}
.mdDay b{display:block; font-family:var(--f-display); font-size:1.15rem; margin-top:4px}
.mdDay small{display:block; color:#B9C6CD; font-size:.86rem; line-height:1.4; margin-top:3px}
.mdMore button.hot{border-color:#FF9142; color:#FFC59A; background:rgb(255 145 66 / .12)}
/* révisions dans le Flash */
.fcRv{background:radial-gradient(130% 55% at 50% -5%, hsl(var(--h) 55% 18%), transparent 72%), #0a0d16}
.rvTag{align-self:flex-start; font-weight:700; font-size:.8rem; padding:6px 12px; border-radius:20px; background:rgb(255 145 66 / .16); color:#FFB37A; border:1px solid rgb(255 145 66 / .4)}
.rvHint{color:#A9B7BF; margin:14px 0 0; font-size:.92rem}
.fc h2.rvQ{font-size:clamp(1.3rem, 5.6vw, 1.7rem); line-height:1.25; margin:8px 0 16px}
.rvFb .btnRow{margin-top:10px}
.rvFb .bigBtn svg{width:16px; height:16px}
.rvSum{color:#FFB37A; margin:8px 0 0; font-weight:700}
/* parcours */
.paths{display:flex; flex-direction:column; gap:8px; margin-top:14px}
.path{display:flex; align-items:center; gap:12px; width:100%; text-align:left; font:inherit; color:var(--ink); padding:12px 14px; border-radius:16px; border:1px solid var(--line); background:var(--surface); cursor:pointer}
.path:hover{border-color:hsl(var(--h) 60% var(--secLit))}
.path .pe{font-size:1.8rem; width:44px; text-align:center; flex:none}
.path .pt{flex:1; min-width:0}
.path b{display:block; font-family:var(--f-display); font-size:1.02rem}
.path small{display:block; color:var(--muted); font-size:.84rem; line-height:1.35; margin-top:2px}
.path .pm{display:block; font-family:var(--f-mono); font-size:.68rem; color:var(--muted); margin-top:6px}
.path .pbar{display:block; height:4px; border-radius:2px; background:var(--surface2); margin-top:5px; overflow:hidden}
.path .pbar i{display:block; height:100%; background:hsl(var(--h) 65% var(--secLit))}
.path > svg{width:18px; height:18px; color:var(--muted); flex:none}
/* actualité */
.actu{display:flex; flex-direction:column; gap:12px; margin-top:14px}
.aItem{border:1px solid var(--line); border-radius:16px; padding:14px 16px; background:var(--surface)}
.aItem h3{display:flex; gap:10px; align-items:flex-start; margin:0; font-family:var(--f-display); font-size:1.06rem; line-height:1.3}
.aItem h3 span{font-size:1.3rem; line-height:1}
.aItem p{margin:8px 0 0; line-height:1.6}
.aChips{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; align-items:center}
.aChips .lab{font-size:.78rem; color:var(--muted); margin-right:2px}
.aChip{font:inherit; font-size:.8rem; font-weight:700; padding:5px 10px; border-radius:14px; cursor:pointer; color:hsl(var(--h) 55% var(--secL)); background:hsl(var(--h) 65% var(--secLit) / .12); border:1px solid hsl(var(--h) 60% var(--secLit) / .4)}

/* ---------- Cette semaine (style simple, polices de l'appli) ---------- */
.journal{position:fixed; inset:0; z-index:47; overflow-y:auto; background:var(--bg); color:var(--ink); animation:fade .25s ease; -webkit-overflow-scrolling:touch}
body.jOn .fl:not(.toast){visibility:hidden}
.jPaper{max-width:760px; margin:0 auto; min-height:100%; padding:0 max(18px, env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(18px, env(safe-area-inset-left,0px)); font-family:var(--f-body)}
.jBar{position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:10px; padding:calc(10px + env(safe-area-inset-top,0px)) 0 10px; background:var(--bg);
  font-family:var(--f-mono); font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.jClose{width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--ink); display:grid; place-items:center; cursor:pointer}
.jClose svg{width:18px; height:18px}
.jMast{padding:8px 0 14px}
.jMeta{display:flex; gap:12px; font-family:var(--f-mono); font-size:.68rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.jMeta span:last-child{display:none}
.jMast h1{font-family:var(--f-display); font-weight:800; font-size:clamp(1.9rem, 8vw, 2.6rem); line-height:1.05; margin:6px 0 4px}
.jTag{color:var(--muted); font-size:.95rem}
.jTicker{display:grid; grid-template-columns:repeat(2, 1fr); gap:8px; margin:6px 0 18px}
.jFig{padding:10px 12px; border-radius:14px; background:var(--surface); border:1px solid var(--line)}
.jFig b{display:block; font-family:var(--f-display); font-size:1.3rem; font-weight:700; line-height:1.1}
.jFig b i{font-style:normal; font-size:.6em; margin-left:4px; vertical-align:middle}
.jFig.up b i{color:#E5484D} .jFig.down b i{color:#2FB67C}
.jFig span{display:block; font-size:.8rem; color:var(--ink); margin-top:2px}
.jFig small{display:block; font-family:var(--f-mono); font-size:.62rem; color:var(--muted); margin-top:1px}
.jKick{display:inline-block; font-family:var(--f-mono); font-size:.66rem; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); font-weight:700}
.jKick.big{font-size:.7rem}
.jUne{padding:16px; border-radius:20px; background:var(--surface); border:1px solid var(--line)}
.jUne h2{font-family:var(--f-display); font-weight:800; font-size:clamp(1.45rem, 6vw, 1.9rem); line-height:1.12; margin:6px 0 10px; text-wrap:balance}
.jChapo{font-size:1.04rem; line-height:1.5; font-weight:700; margin:0 0 10px}
.jCols p{font-size:.98rem; line-height:1.62; margin:0 0 10px}
.jChips{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:10px}
.jChips > span{font-family:var(--f-mono); font-size:.62rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-right:2px}
.jChip{font:inherit; font-size:.8rem; font-weight:700; color:var(--accent); background:color-mix(in srgb, var(--accent) 10%, var(--surface)); border:1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); border-radius:14px; padding:5px 10px; cursor:pointer}
.jPoll{margin:14px 0 0; padding:16px; border-radius:20px; background:var(--surface); border:1px solid var(--line)}
.jHead{display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:10px}
.jHead h3, .jAgenda h3{font-family:var(--f-display); font-weight:800; font-size:1.15rem; margin:0}
.jCount{font-family:var(--f-mono); font-size:.72rem; color:var(--muted)}
.jCount b{font-family:var(--f-display); font-size:1.15rem; color:var(--accent)}
.jRows{display:flex; flex-direction:column; gap:7px}
.jRow{display:grid; grid-template-columns:minmax(110px, 36%) 1fr 52px; align-items:center; gap:8px}
.jRow .nm{font-weight:700; font-size:.86rem; line-height:1.15}
.jRow .nm small{display:block; font-weight:400; font-size:.7rem; color:var(--muted)}
.jRow .br{height:12px; border-radius:6px; background:var(--surface2); overflow:hidden}
.jRow .br i{display:block; height:100%; border-radius:6px; background:hsl(var(--ph) 55% 50%)}
.jRow b{text-align:right; font-family:var(--f-mono); font-size:.82rem}
.jNote{font-size:.84rem; color:var(--muted); margin:12px 0 2px}
.jSrc{font-family:var(--f-mono); font-size:.62rem; color:var(--muted); margin:0}
.jRub{font-family:var(--f-display); font-weight:800; font-size:1.25rem; margin:24px 0 8px}
.jGrid{display:flex; flex-direction:column; gap:8px}
.jArt{padding:14px; border-radius:16px; background:var(--surface); border:1px solid var(--line)}
.jArt h3{font-family:var(--f-display); font-weight:700; font-size:1.08rem; line-height:1.25; margin:4px 0 6px}
.jArt p{font-size:.95rem; line-height:1.58; margin:0}
.jSide{display:flex; flex-direction:column; gap:12px; margin-top:24px}
.jAgenda{padding:16px; border-radius:20px; background:var(--surface); border:1px solid var(--line)}
.jAgenda ol{list-style:none; margin:10px 0 0; padding:0}
.jAgenda li{display:grid; grid-template-columns:96px 1fr; gap:10px; padding:7px 0; border-bottom:1px solid var(--line); font-size:.9rem}
.jAgenda li:last-child{border-bottom:0}
.jAgenda li b{font-family:var(--f-mono); font-size:.74rem; color:var(--accent); padding-top:2px}
.jMot{padding:16px; border-radius:20px; background:color-mix(in srgb, var(--accent) 9%, var(--surface)); border:1px solid color-mix(in srgb, var(--accent) 30%, var(--line))}
.jMot h3{font-family:var(--f-display); font-weight:800; font-size:1.15rem; margin:4px 0 6px}
.jMot p{line-height:1.55; margin:0}
.jFoot{margin-top:20px; font-size:.76rem; color:var(--muted); text-align:center}

/* ---------- Outils interactifs ---------- */
.wdg{margin-top:18px; border-radius:18px; padding:14px 14px 12px; border:1.5px solid hsl(var(--h) 60% var(--secLit) / .5); background:linear-gradient(160deg, hsl(var(--h) 70% var(--secLit) / .1), var(--surface) 60%)}
.wHead{display:flex; align-items:center; gap:10px; margin-bottom:10px}
.wIc{width:36px; height:36px; border-radius:11px; display:grid; place-items:center; background:hsl(var(--h) 70% var(--secLit)); font-size:1.1rem; flex:none}
.wHead small{display:block; font-family:var(--f-mono); font-size:.62rem; letter-spacing:.1em; text-transform:uppercase; color:hsl(var(--h) 55% var(--secL))}
.wHead b{display:block; font-family:var(--f-display); font-size:1.05rem; color:var(--ink)}
.wSl{display:block; margin:8px 0}
.wl{display:flex; justify-content:space-between; gap:8px; font-size:.86rem; color:var(--muted)}
.wl b{color:var(--ink); font-family:var(--f-mono); font-size:.86rem; white-space:nowrap}
.wSl input[type=range]{width:100%; margin:6px 0 0; accent-color:hsl(var(--h) 65% var(--secLit)); touch-action:none; height:26px}
.wSl select{width:100%; margin-top:6px; font:inherit; font-size:.9rem; padding:8px 10px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink)}
.wBtns{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0}
.wBtns button{font:inherit; font-size:.78rem; font-weight:700; padding:6px 10px; border-radius:14px; border:1px solid var(--line); background:var(--surface2); color:var(--ink); cursor:pointer}
.wOut{margin-top:10px}
.wKs{display:grid; grid-template-columns:repeat(auto-fit, minmax(92px, 1fr)); gap:6px; margin:8px 0}
.wK{background:var(--surface2); border-radius:12px; padding:8px 10px}
.wK b{display:block; font-family:var(--f-display); font-size:1.12rem; line-height:1.15; color:var(--ink)}
.wK span{display:block; font-size:.72rem; color:var(--muted); line-height:1.25; margin-top:2px}
.wK.hi b{color:hsl(var(--h) 55% var(--secL))} .wK.ok b{color:#2FB67C} .wK.warn b{color:#E0702F}
.wSub{font-size:.84rem; color:var(--muted); margin:10px 0 4px}
.wNote{font-size:.82rem; color:var(--muted); margin:8px 0 0; line-height:1.45}
.wChart{width:100%; height:150px; display:block; margin-top:6px}
.wChart.sd{height:auto; aspect-ratio:320 / 200}
.wChart .grid{stroke:var(--line); stroke-width:1}
.wChart .ax{stroke:var(--muted); stroke-width:1.5}
.wChart .lb{fill:var(--muted); font-size:10px; font-family:var(--f-mono)}
.wChart .dash{stroke:var(--muted); stroke-dasharray:4 4}
.wChart .ln{fill:none; stroke-width:3; stroke-linecap:round; stroke-linejoin:round}
.wChart .area{opacity:.18; stroke:none}
.wChart .pt{fill:var(--ink); stroke:var(--surface); stroke-width:3}
.wChart .c1{stroke:#3B82F6} .wChart .area.c1{fill:#3B82F6}
.wChart .c2{stroke:#9AA6AE; stroke-dasharray:5 4} 
.wChart .c3{stroke:#E5484D} .wChart .area.c3{fill:#E5484D}
.wLeg{display:flex; flex-wrap:wrap; gap:12px; font-size:.74rem; color:var(--muted); margin-top:4px}
.wLeg i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px}
.wBars{display:flex; flex-direction:column; gap:6px; margin:6px 0}
.wBar{display:grid; grid-template-columns:minmax(80px, 34%) 1fr auto; align-items:center; gap:8px; font-size:.8rem}
.wBar > span:first-child{color:var(--muted); line-height:1.2}
.wBar .t{height:12px; border-radius:6px; background:var(--surface2); overflow:hidden}
.wBar .t i{display:block; height:100%; border-radius:6px; transition:width .25s}
.wBar b{font-family:var(--f-mono); font-size:.74rem; color:var(--ink); white-space:nowrap}
.wdg .c1, .wLeg .c1{background:#3B82F6} .wdg .c2, .wLeg .c2{background:#2FB67C} .wdg .c3, .wLeg .c3{background:#E5484D} .wdg .c4{background:#B45309} .wdg .c5{background:#9AA6AE}
.wLeg .pt{background:var(--ink); border-radius:50%}
.wLeg .c5{background:#9AA6AE}
.wTag{font-size:.8em; vertical-align:1px}
.wChart .ln.c2{stroke:#9AA6AE}
.pond{height:110px; border-radius:50%; background:radial-gradient(#5C9BCB, #1A4C78); position:relative; overflow:hidden; margin:6px auto; max-width:220px}
.pond i{position:absolute; inset:0; margin:auto; width:100%; height:100%; border-radius:50%; background:radial-gradient(circle, #4ADE80, #15803D); transition:transform .25s}

/* ---------- Astuces progressives ---------- */
.swipeHint{display:none}
.coach{position:fixed; inset:0; z-index:300; pointer-events:none; opacity:0; transition:opacity .2s}
.coach.on{opacity:1}
.chRing{position:fixed; border:2px solid #FFB866; box-shadow:0 0 0 4px rgb(255 184 102 / .25), 0 0 24px rgb(255 160 70 / .5); animation:chPulse 1.4s ease-in-out infinite}
@keyframes chPulse{50%{box-shadow:0 0 0 9px rgb(255 184 102 / 0), 0 0 30px rgb(255 160 70 / .7)}}
.chBub{position:fixed; max-width:min(300px, calc(100vw - 32px)); display:flex; align-items:center; gap:10px; padding:11px 12px 11px 14px; border-radius:16px; background:#FFF6EA; color:#1d1a16; box-shadow:0 10px 30px rgb(0 0 0 / .45); pointer-events:auto; transform:translateY(6px); transition:transform .25s var(--ease)}
.coach.on .chBub{transform:none}
.chBub p{margin:0; font-size:.9rem; line-height:1.35}
.chBub p b{color:#B4500F}
.chOk{flex:none; border:0; border-radius:12px; padding:7px 11px; font:inherit; font-weight:700; font-size:.82rem; background:#1d1a16; color:#fff; cursor:pointer}
.chArr{position:absolute; left:var(--ax, 50%); top:-7px; width:14px; height:14px; margin-left:-7px; background:#FFF6EA; transform:rotate(45deg); border-radius:3px}
.chBub.up .chArr{top:auto; bottom:-7px}
.coach.center .chArr{display:none}
.coach.center .chBub{flex-direction:column; text-align:center; padding:16px 18px 14px; gap:10px}
.chG{flex:none; position:relative; width:38px; height:38px; display:grid; place-items:center}
.coach.center .chG{width:70px; height:56px}
.chHand{display:block; width:18px; height:18px; border-radius:50%; background:#E58A2E; box-shadow:0 0 0 5px rgb(229 138 46 / .25)}
.chG.up .chHand{animation:hUp 1.5s ease-in-out infinite}
.chG.left .chHand{animation:hLeft 1.5s ease-in-out infinite}
.chG.spin .chHand{animation:hSpin 2s ease-in-out infinite}
@keyframes hUp{0%{transform:translateY(12px); opacity:0} 20%{opacity:1} 70%{transform:translateY(-12px); opacity:1} 100%{transform:translateY(-14px); opacity:0}}
@keyframes hLeft{0%{transform:translateX(12px); opacity:0} 20%{opacity:1} 70%{transform:translateX(-12px); opacity:1} 100%{transform:translateX(-14px); opacity:0}}
@keyframes hSpin{0%,100%{transform:translateX(-18px) rotate(-8deg)} 50%{transform:translateX(18px) rotate(8deg)}}
@media (prefers-reduced-motion: reduce){.chHand, .chRing{animation:none !important}}
body:has(.skCel) .coach, body:has(.wkCel) .coach, body:has(.lvTest) .coach{display:none}
/* ----- Test de niveau ----- */
.ltIntro .lead{margin-top:6px}
.ltAll{display:flex; align-items:center; gap:12px; width:100%; margin-top:18px; padding:14px; border-radius:18px; border:1.5px solid hsl(24 80% 58% / .6); cursor:pointer; text-align:left; color:var(--ink);
  background:linear-gradient(110deg, hsl(24 90% 60% / .2), hsl(24 90% 60% / .05)); font:inherit}
.ltAll .ic{width:42px; height:42px; border-radius:13px; background:linear-gradient(135deg, #FF5A4E, #FF9142); color:#fff; display:grid; place-items:center; flex:none}

.ltAll small{display:block; color:var(--muted); font-size:.84rem}
.ltAll > svg:last-child{margin-left:auto; width:18px; height:18px; flex:none; color:hsl(24 75% 50%)}
.ltOr{font-family:var(--f-mono); font-size:.7rem; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); margin:22px 0 10px}
.ltGrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:8px}
.ltDom{display:flex; flex-direction:column; align-items:flex-start; gap:4px; padding:12px; border-radius:14px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font:inherit; text-align:left; cursor:pointer}
.ltDom i{width:22px; height:4px; border-radius:2px; background:hsl(var(--h) 65% var(--secLit))}
.ltDom b{font-family:var(--f-display); font-size:.95rem}
.ltBest{display:inline-block; margin-top:3px; font-family:var(--f-mono); font-size:.66rem; color:hsl(24 75% 45%)}
.ltMeta{display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-top:18px}
.ltMeta .qzN{margin:0}
.ltAbout{margin:12px 0 0; font-size:.88rem; color:var(--muted)} .ltAbout b{color:var(--ink); font-weight:600}
.lvTest .qzQ{margin-top:4px}
.ltSec{font-family:var(--f-mono); font-size:.68rem; padding:3px 8px; border-radius:20px; background:hsl(var(--h) 65% var(--secLit) / .16); color:hsl(var(--h) 55% var(--secL, 40%))}
.ltLv{margin-left:auto; font-family:var(--f-mono); font-size:.68rem; color:var(--muted); letter-spacing:.02em}
.ltLv.l2{color:hsl(36 80% 45%)} .ltLv.l3{color:hsl(4 75% 52%)}
.ltEnd{text-align:center; padding:22px 0 4px}
.ltRank{font-family:var(--f-display); font-size:clamp(2.2rem, 10vw, 3rem); font-weight:800; margin:4px 0 14px; background:linear-gradient(110deg, #FF5A4E, #FF9142); -webkit-background-clip:text; background-clip:text; color:transparent}
.ltGauge{position:relative; height:10px; border-radius:6px; background:var(--surface2); overflow:hidden; max-width:420px; margin:0 auto}
.ltGauge i{position:absolute; inset:0 auto 0 0; border-radius:6px; background:linear-gradient(90deg, #FF9142, #FF5A4E); animation:ltFill 1.1s var(--ease) both}
.ltGauge s{position:absolute; top:0; bottom:0; width:2px; background:var(--surface); opacity:.8}
@keyframes ltFill{from{width:0}}
.ltPct{margin:10px 0 0; color:var(--muted); font-size:.88rem}
.ltPct b{color:var(--ink); font-family:var(--f-display); font-size:1.05rem}
.ltMsg{margin:14px auto 0; max-width:46ch; font-size:1.04rem; line-height:1.55}

/* ----- Pourquoi c'est comme ça ----- */
.box.chain{background:hsl(var(--h) 65% var(--secLit) / .07); border-color:hsl(var(--h) 60% var(--secLit) / .3)}
.box.chain h4 .ic{background:hsl(var(--h) 70% var(--secLit)); color:#fff}
.chn{list-style:none; margin:10px 0 0; padding:0; display:flex; flex-direction:column}

.chn li:not(.last)::after{content:""; position:absolute; left:9px; top:20px; bottom:2px; width:2px; background:hsl(var(--h) 60% var(--secLit) / .35)}

.fc .box.chain{margin-top:14px}
