/* ----- À suivre : l'enchaînement automatique ----- */
.nxCard{margin-top:28px; padding-top:18px; border-top:1px solid var(--line)}
.nxHead{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px}
.nxLab{font-family:var(--f-mono); font-size:.7rem; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); font-weight:500}
.nxChain{font-family:var(--f-mono); font-size:.68rem; letter-spacing:.02em; padding:3px 9px; border-radius:20px; background:hsl(24 85% 55% / .14); color:hsl(24 75% 42%); font-weight:600}
.nxMain{position:relative; display:flex; flex-direction:column; align-items:flex-start; gap:6px; width:100%; text-align:left; cursor:pointer; color:var(--ink);
  padding:16px 70px 16px 16px; border-radius:18px; border:1.5px solid hsl(var(--nh) 60% var(--secLit) / .55);
  background:linear-gradient(120deg, hsl(var(--nh) 70% var(--secLit) / .2), hsl(var(--nh) 70% var(--secLit) / .05)); transition:transform .15s var(--ease)}
.nxMain:active{transform:scale(.985)}
.nxWhere{font-family:var(--f-mono); font-size:.66rem; text-transform:uppercase; letter-spacing:.08em; color:hsl(var(--nh) 55% var(--secL, 40%))}
.nxT{font-family:var(--f-display); font-size:1.22rem; line-height:1.25; font-weight:800}
.nxHook{font-size:.98rem; line-height:1.45; color:var(--ink); opacity:.85; max-width:52ch}
.nxMeta{display:flex; gap:12px; font-family:var(--f-mono); font-size:.68rem; color:var(--muted); margin-top:2px}
.nxPlay{position:absolute; right:16px; top:50%; transform:translateY(-50%); width:44px; height:44px; border-radius:50%; display:grid; place-items:center;
  background:hsl(var(--nh) 70% var(--secLit)); color:#fff; box-shadow:0 6px 18px hsl(var(--nh) 70% var(--secLit) / .35)}
.nxPlay svg{width:20px; height:20px; margin-left:2px}
.nxBar{height:4px; border-radius:4px; background:var(--line); overflow:hidden; margin-top:12px}
.nxBar i{display:block; height:100%; width:0; background:hsl(var(--nh) 70% var(--secLit)); border-radius:4px}
.nxCard.run .nxBar i{width:100%; transition:width 6.5s linear}
.nxCard.run .nxPlay{animation:nxPulse 1.3s var(--ease) infinite}
.nxCard.held .nxBar, .nxCard.paused .nxBar i{opacity:.5}
.nxFoot{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:10px}
.nxHint{font-size:.82rem; color:var(--muted)}
.nxStay{flex:none; font:inherit; font-size:.84rem; font-weight:600; padding:7px 13px; border-radius:20px; border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer}
@keyframes nxPulse{0%,100%{transform:translateY(-50%) scale(1)}50%{transform:translateY(-50%) scale(1.08)}}
@media (prefers-reduced-motion: reduce){.nxCard.run .nxPlay{animation:none}}
/* ----- étoile filante (secret) ----- */
.shoot{position:absolute; z-index:3; width:48px; height:48px; margin:-24px 0 0 -24px; padding:0; border:0; background:none; cursor:pointer;

<script>
/* Aalam — chargeur de contenu. Les fiches sont dans data/<section>.js (chargés au démarrage, chacun mis en cache à part),
   les articles « En savoir plus » dans data/more/<section>.json (chargés seulement quand on en a besoin). */
const AD = (() => {
  const store = {}, later = {}, loaded = {}, pending = {}, subs = [];
  let meta = {}, ver = {};
  const take1 = id => { if (!(id in store)) throw new Error("Aalam : donnée manquante " + id); return store[id]; };
  return {
    put(o){ Object.assign(store, o); },
    take1,
    take: (...ids) => ids.map(take1),
    obj: (...ids) => Object.fromEntries(ids.map(take1)),
    // pour les lots ajoutés plus tard : AD.later("fiches", () => NEWF.push({...}))
    later(point, fn){ (later[point] ||= []).push(fn); },
    run(point){ (later[point] || []).forEach(fn => fn()); },
    meta(m, v){ meta = m; ver = v; },
    stubMore(MORE){
      for (const sec in meta) for (const k in meta[sec]){
        const [min, deb] = meta[sec][k];
        if (!MORE[k]) MORE[k] = {stub: true, sec, min, parts: [], debates: deb ? [0] : []};
      }
    },
    isStub: m => !!(m && m.stub),
    // charge les articles d'une section (une seule fois), puis prévient l'appli
    more(sec){
      if (loaded[sec] || !ver[sec]) return Promise.resolve();
      return pending[sec] ||= fetch("data/more/" + sec + ".json?v=" + ver[sec]).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(d => { for (const k in d) MORE[k] = d[k]; loaded[sec] = true; subs.forEach(f => { try { f(sec, d); } catch(e){ console.error(e); } }); })
        .finally(() => { delete pending[sec]; });
    },
    moreFor(key){ const m = MORE[key]; return m && m.stub ? AD.more(m.sec) : Promise.resolve(); },
    moreAll(){ return Object.keys(ver).reduce((p, s) => p.then(() => AD.more(s).catch(() => {})), Promise.resolve()); },
    onMore(f){ subs.push(f); },
    sections: () => Object.keys(ver)
  };
})();
</script>

function addN(sid, group, n){
  const s = SECTIONS.find(x => x.id === sid);
  let g = s.groups.find(x => x.title === group);
  if (!g){ g = {title:group, notions:[]}; s.groups.push(g); }
  g.notions.push(n);
  if (n.lv) NLEVEL[n.t] = n.lv;
  if (n.q) QUIZ[n.t] = n.q;
}
const mkN = (sid, group) => (t, lv, p, intro, ex, why, see, q) => addN(sid, group, {t, lv, p, intro, ex, why, see, q});

function drawSky(){
  const sk = $("#sky"), g = sk.getContext("2d");
  sk.width = Math.round(W*DPR); sk.height = Math.round(H*DPR); sk.style.width = W+"px"; sk.style.height = H+"px";
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  let seed = 11; const rnd = () => (seed = (seed*16807) % 2147483647)/2147483647;
  g.fillStyle = "#04070d"; g.fillRect(0, 0, W, H);
  g.fillStyle = "#ffffff";
  for (let i = 0; i < W*H/1400; i++){
    const r = Math.pow(rnd(), 4)*1.3 + .35;
    g.globalAlpha = rnd()*.65 + .15;
    g.beginPath(); g.arc(rnd()*W, rnd()*H, r, 0, 2*Math.PI); g.fill();
  }
  g.globalAlpha = 1;
}

// Met en valeur dates, siècles, grands nombres et citations dans un texte (déjà échappé ici).
function fmt(s){
  let h = esc(s).replace(/ ([:;?!»])/g, "\u00a0$1").replace(/« /g, "«\u00a0");
  h = h.replace(/«[^»]{1,180}»/g, m => `<span class="qt">${m}</span>`);
  h = h.replace(/\b\d{1,3}(?:[\s ]\d{3})*(?:,\d+)?(?:\s(?:millions?|milliards?)\b|\s?%)/g, m => `<b class="num">${m}</b>`);
  h = h.replace(/\b[IVXL]+ᵉ(?:ʳ)?(?:\s(?:et|ou|au)\s(?:le\s)?[IVXL]+ᵉ)?\ssiècles?(?:\sav\. J\.-C\.)?/g, m => `<span class="dt">${m}</span>`);
  h = h.replace(/(?<![\d>,.])\b(?:vers\s)?\d{1,4}(?:\s(?:et|à)\s\d{1,4})?\sav\. J\.-C\./g, m => `<span class="dt">${m}</span>`);
  h = h.replace(/(?<!\d[\s ])(?<![\d,.(>])(?<!vers\s)\b(?:vers\s)?\d{3,4}(?:-\d{3,4})?\b(?![\s ]?\d)(?!\s?(?:km|%|ans\b|morts|millions|milliards|soldats|personnes|habitants|hommes|navires|voix|députés|articles|amendements|<\/b>))(?:\sav\. J\.-C\.)?/g, m => `<span class="dt">${m}</span>`);
  return h;
}
function hookOf(k){ return (typeof HOOK !== "undefined" && HOOK && HOOK[k]) || ""; }
function hookHtml(k){ const h = hookOf(k); return h ? `<p class="hook">${fmt(h)}</p>` : ""; }
// Découpe une intro : une phrase d'accroche, puis des paragraphes courts.
function paras(s){
  const P = "\u0001";
  const sent = String(s).replace(/av\. J\.-C\./g, "av" + P).split(/(?<=[.!?…»]|\u0001)\s+(?=[A-ZÀ-ÖØ-Ý«])/).map(x => x.replaceAll("av" + P, "av. J.-C."));
  const out = [sent.shift()]; let cur = "";
  for (const x of sent){ cur = cur ? cur + " " + x : x; if (cur.length > 150){ out.push(cur); cur = ""; } }
  if (cur) out.push(cur);
  return `<div class="txt"><p class="chap">${fmt(out[0])}</p>${out.slice(1).map(p => `<p>${fmt(p)}</p>`).join("")}</div>`;
}

function feedPool(secId, used){
  let items = NOTIONS.filter(n => n.sec.id === secId && n.ready).map(n => ({k:"n", n}));
  if (secId === "geo"){ const cf = CONFLICTS.map(c => ({k:"c", c})); items = fq.goal === "actu" ? [...cf, ...items] : [...items, ...cf]; }
  const ul = userLvl(secId);

  const unread = items.filter(it => !READ.has(itemKey(it))), read = items.filter(it => READ.has(itemKey(it)));
  // à ton niveau d'abord, puis le niveau en dessous
  const byLv = a => a.map(x => [lvlOfKey(itemKey(x)) === ul ? 0 : 1, x]).sort((p, q) => p[0] - q[0]).map(x => x[1]);
  const u = fq.goal === "actu" && secId === "geo" ? [...unread.filter(x => x.k === "c"), ...byLv(shuffle(unread.filter(x => x.k !== "c")))] : byLv(shuffle(unread));
  return [...u, ...shuffle(read)];
}

function buildFeed(budget, fav){
  if (!fav && typeof tsReady === "function" && tsReady()) return tasteBuild(budget);
  const used = new Set(FEED.filter(x => x.k !== "end").map(itemKey));
  const pools = fav ? [[...FAV].map(fromKey).filter(x => x.c || x.n)] : shuffle(fq.secs).map(id => feedPool(id, used));
  const out = []; let min = 0, i = 0;
  while (pools.some(p => p.length)){
    const p = pools[i++ % pools.length]; if (!p.length) continue;
    const it = p.shift(), m = itemMin(it);
    if (!fav && min + m > budget && out.length) break;
    out.push(it); min += m;
  }
  return {items:out, min};
}

/* ---------- 3. Révisions espacées : les questions ratées reviennent ---------- */
const RV_DAYS = [0.8, 3, 7, 16, 35];
let REVIEW = store.get("review") || {};
const rvId = (key, q) => key + "¦" + q;
function reviewResult(key, q, ok){
  const id = rvId(key, q), r = REVIEW[id], now = Date.now();
  if (!ok) REVIEW[id] = {k:key, q, box:0, due: now + RV_DAYS[0] * 864e5};
  else if (r){ r.box++; if (r.box >= RV_DAYS.length) delete REVIEW[id]; else r.due = now + RV_DAYS[r.box] * 864e5; }
  store.set("review", REVIEW);
}
const dueReviews = () => Object.keys(REVIEW).filter(id => REVIEW[id].due <= Date.now() && QUIZ[REVIEW[id].k]);
function reviewItem(id){
  const r = REVIEW[id]; if (!r) return null;
  const qq = (QUIZ[r.k] || []).find(x => x[0] === r.q); if (!qq){ delete REVIEW[id]; return null; }
  return {k:"r", id, key:r.k, q:qq[0], good:qq[1], why:qq[5], opts:shuffle(qq.slice(1, 5))};
}
function withReviews(items){
  const rv = shuffle(dueReviews()).slice(0, 5).map(reviewItem).filter(Boolean);
  if (!rv.length) return items;
  const out = []; let j = 0;
  items.forEach((it, i) => { out.push(it); if (j < rv.length && i >= 1 && (i - 1) % 3 === 0) out.push(rv[j++]); });
  while (j < rv.length) out.push(rv[j++]);
  return out;
}
function fcReview(it, i){

    <div class="rvFb"></div></div></div></div></section>`;
}
function answerReview(i, j){
  const it = FEED[i]; if (!it || it.k !== "r" || it.done) return; it.done = true;
  const ok = it.opts[j] === it.good; it.ok = ok; reviewResult(it.key, it.q, ok);

  el.querySelectorAll(".qzOpt").forEach((b, k) => { b.disabled = true; if (it.opts[k] === it.good) b.classList.add("good"); else if (k === j) b.classList.add("bad"); });
  const r = REVIEW[rvId(it.key, it.q)], next = r ? Math.round(RV_DAYS[r.box]) : null;
  const open = it.key.startsWith("c:") ? `data-open-conflict="${it.key.slice(2)}"` : `data-open-notion="${esc(it.key)}"`;
  el.querySelector(".rvFb").innerHTML = `<div class="qzFb ${ok ? "ok" : "ko"}"><b>${ok ? "Bien retenu !" : "Pas encore."}</b> ${ok ? (r ? `Prochaine révision dans ${next} jour${next > 1 ? "s" : ""}.` : "Question maîtrisée, elle ne reviendra plus.") : `La bonne réponse : ${fmt(it.good)}. Elle reviendra demain.`}</div>

  if (ok) checkAch();
}

const gv = (r, id) => +r.querySelector(`[data-i="${id}"]`).value;

const kpi = (v, l, cls = "") => `<div class="wK ${cls}"><b>${v}</b><span>${l}</span></div>`;
function lineChart(series, opts = {}){
  // series : [{pts:[y…], cls}] sur des x réguliers
  const W = 320, H = 150, P = 6, n = series[0].pts.length;
  const max = opts.max ?? (Math.max(...series.flatMap(s => s.pts)) * 1.05 || 1);
  const X = i => P + i * (W - 2 * P) / Math.max(1, n - 1), Y = v => H - P - v / max * (H - 2 * P);
  const path = s => s.pts.map((v, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join("");
  return `<svg class="wChart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    ${[.25, .5, .75].map(f => `<line x1="0" x2="${W}" y1="${Y(max * f)}" y2="${Y(max * f)}" class="grid"/>`).join("")}
    ${series.map(s => (s.area ? `<path d="${path(s)}L${X(n - 1)},${H - P}L${X(0)},${H - P}Z" class="area ${s.cls}"/>` : "") + `<path d="${path(s)}" class="ln ${s.cls}"/>`).join("")}
  </svg>${opts.legend ? `<div class="wLeg">${opts.legend.map(([c, l]) => `<span><i class="${c}"></i>${l}</span>`).join("")}</div>` : ""}`;
}

      <div class="mpThemes">${MP_THEMES.map(t => { const n = MP.billes[t.id]; return `<div class="mpTh"><span class="mpThIc">${ICN[t.ic]}</span><b>${esc(t.t)}</b>
        <div class="mpCtl"><button data-mp-minus="${t.id}" ${n ? "" : "disabled"} aria-label="Retirer une bille">−</button><span class="mpBil">${Array.from({length:Math.max(n, 1)}, (_, i) => `<i class="${i < n ? "on" : ""}"></i>`).join("")}</span><button data-mp-plus="${t.id}" ${left ? "" : "disabled"} aria-label="Ajouter une bille">+</button></div></div>`; }).join("")}</div>
      <button class="bigBtn go mpGo" data-mp-next ${used ? "" : "disabled"}>${left ? `Continuer avec ${used} bille${used > 1 ? "s" : ""}` : "C'est parti"}</button></div>`;
  } else if (MP.step === 2){

      <span class="mpEy">${ICN[th.ic]}${esc(th.t)}</span>
      <h2 class="mpQ">${fmt(q.q)}</h2>
      <details class="mpCtx"><summary>Comprendre l'enjeu</summary><p>${fmt(q.ctx)}</p></details>
      <div class="mpScale">${MP_LBL.map((l, j) => `<button class="mpA a${j}${a === j - 2 ? " on" : ""}" data-mp-ans="${j - 2}"><i></i>${l}</button>`).join("")}</div>
      <div class="mpNav"><button data-mp-prev ${MP.i ? "" : "disabled"}>${IC_BACK}Précédente</button><button data-mp-skip>Passer</button></div></div>`;

function mpScore(){
  const w = Object.fromEntries(MP_THEMES.map(t => [t.id, 1 + 2 * (MP.billes[t.id] || 0)]));
  const scores = MP_PARTIES.map((p, k) => {
    let s = 0, tot = 0; const byTh = {};
    MP_Q.forEach((q, i) => { const u = MP.ans[i]; if (u === undefined) return;
      const ag = 1 - Math.abs(u - q.p[k]) / 4; s += w[q.th] * ag; tot += w[q.th];
      (byTh[q.th] = byTh[q.th] || [0, 0]); byTh[q.th][0] += ag; byTh[q.th][1]++; });
    return {id:p.id, pct: tot ? Math.round(s / tot * 100) : 0, byTh};
  }).sort((a, b) => b.pct - a.pct);

  store.set("match", res); return res;
}

      <p class="mpCx">${fmt(q.ctx)}</p>${q.f ? `<button class="mpF" data-open-notion="${esc(q.f)}">Lire la fiche « ${esc(q.f)} »</button>` : ""}</details>`; }).join("")}</div>
    <p class="mpNote">Méthode : pour chaque affirmation, on mesure l'écart entre ta réponse et la position du parti (de 0 à 4 crans). Chaque thème compte une fois de base, plus deux fois par bille posée. Les positions sont simplifiées et peuvent évoluer d'ici la présidentielle d'avril 2027 : vérifie toujours les programmes officiels.</p>

/* ---------- Astuces progressives : une petite bulle, une seule fois, au bon moment ---------- */
let TIPS = store.get("tips") || {};
let tipQ = [], tipOn = null, tipEl = null, tipT = null;
const HAND = '<span class="chHand" aria-hidden="true"></span>';
function tipVisible(el){
  if (!el || !el.isConnected || !el.getClientRects().length) return false;
  const r = el.getBoundingClientRect();
  return r.width > 0 && r.bottom > 40 && r.top < innerHeight - 40 && r.right > 0 && r.left < innerWidth;
}
// tip({id, sel, text, gesture, when})  — sel absent = bulle centrée
function tip(t){
  if (TIPS[t.id] || tipOn?.id === t.id || tipQ.some(x => x.id === t.id)) return;
  tipQ.push({...t, at: Date.now() + (t.delay ?? 600)}); schedTip();
}
function schedTip(){
  clearTimeout(tipT); if (tipOn || !tipQ.length) return;
  const at = Math.min(...tipQ.map(x => x.at));
  tipT = setTimeout(nextTip, Math.max(0, at - Date.now()) + 20);
}
function tipTarget(t){ return t.sel ? (typeof t.sel === "function" ? t.sel() : document.querySelector(t.sel)) : null; }
const tipBlocked = () => !!document.querySelector(".skCel, .wkCel, .lvTest");
function nextTip(){
  if (tipOn) return;
  // jamais par-dessus une célébration ou le test de niveau : on réessaie un peu plus tard
  if (tipBlocked()){ clearTimeout(tipT); tipT = setTimeout(nextTip, 1500); return; }
  const now = Date.now();
  while (tipQ.some(x => x.at <= now)){
    const i = tipQ.findIndex(x => x.at <= now), t = tipQ.splice(i, 1)[0];
    if (TIPS[t.id] || (t.when && !t.when())) continue;
    const el = tipTarget(t);
    if (t.sel && !tipVisible(el)){
      // pas encore à l'écran : on attend qu'il apparaisse (ex. bouton plus bas dans la fiche)
      if (el && el.isConnected && "IntersectionObserver" in window){
        const io = new IntersectionObserver(es => { if (es.some(x => x.isIntersecting)){ io.disconnect(); setTimeout(() => tip({...t, delay:250}), 350); } }, {threshold:.9});
        io.observe(el); setTimeout(() => io.disconnect(), 120000);
      }
      continue;
    }
    return showTip(t, el);
  }
  schedTip();
}
function showTip(t, el){
  tipOn = t;
  tipEl = document.createElement("div"); tipEl.className = "coach" + (el ? "" : " center");
  tipEl.innerHTML = `${el ? '<div class="chRing"></div>' : ""}<div class="chBub" role="status">${t.gesture ? `<span class="chG ${t.gesture}">${HAND}</span>` : ""}<p>${t.text}</p><button class="chOk" type="button">OK</button><i class="chArr"></i></div>`;
  document.body.appendChild(tipEl);
  placeTip();
  requestAnimationFrame(() => tipEl && tipEl.classList.add("on"));
  t.onShow && t.onShow(el);
}
function placeTip(){
  if (!tipOn || !tipEl) return;
  const el = tipTarget(tipOn), bub = tipEl.querySelector(".chBub");
  if (!el){ bub.style.left = Math.max(16, (innerWidth - bub.offsetWidth) / 2) + "px"; bub.style.top = (innerHeight * .5 - bub.offsetHeight / 2) + "px"; return; }
  if (!tipVisible(el)) return closeTip();
  const r = el.getBoundingClientRect(), p = 6, ring = tipEl.querySelector(".chRing");
  Object.assign(ring.style, {left:(r.left - p) + "px", top:(r.top - p) + "px", width:(r.width + 2 * p) + "px", height:(r.height + 2 * p) + "px",
    borderRadius: getComputedStyle(el).borderRadius === "0px" ? "14px" : `calc(${getComputedStyle(el).borderTopLeftRadius} + ${p}px)`});
  const bw = bub.offsetWidth, bh = bub.offsetHeight, cx = r.left + r.width / 2;
  const below = r.top + r.height / 2 < innerHeight / 2;
  let top = below ? r.bottom + p + 14 : r.top - p - 14 - bh;
  top = clamp(top, 12, innerHeight - bh - 12);
  const left = clamp(cx - bw / 2, 16, innerWidth - bw - 16);
  bub.style.left = left + "px"; bub.style.top = top + "px";
  bub.classList.toggle("up", !below);
  bub.style.setProperty("--ax", clamp(cx - left, 22, bw - 22) + "px");
}
function closeTip(){
  if (!tipOn) return;
  TIPS[tipOn.id] = 1; store.set("tips", TIPS);
  const e = tipEl; tipEl = null; tipOn = null;
  if (e){ e.classList.remove("on"); setTimeout(() => e.remove(), 220); }
  tipQ.forEach(x => x.at = Math.max(x.at, Date.now() + 450)); schedTip();
}
// n'importe quel geste ferme la bulle (sans bloquer l'action)
addEventListener("pointerdown", () => { if (tipOn) closeTip(); }, true);
addEventListener("keydown", e => { if (tipOn && (e.key === "Escape" || e.key === "Enter")) closeTip(); }, true);

/* ==========================================================================
   Série de jours, objectif du jour et points (étape 3 du programme)
   ========================================================================== */
const dk = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const dShift = (k, n) => { const [y, m, d] = k.split("-").map(Number); return dk(new Date(y, m - 1, d + n)); };
const today = () => dk(new Date());
const SK_GOALS = [[20, "Tranquille", "2 fiches environ"], [30, "Régulier", "3 fiches environ"], [60, "Sérieux", "6 fiches environ"]];
const SK_STEPS = [3, 7, 14, 30, 50, 100, 200, 365];
const SK_XP = {read:10, deep:5, quizOk:3, quizEnd:5, review:5, flash:10, teaser:2};
let SK = store.get("streak2");
if (!SK){
  // reprise des jours d'activité déjà enregistrés, pour ne pas perdre la série en cours
  SK = {goal:30, xp:{}, days:{}, frz:1, frzKey:"", best:0, lost:0, lostSeen:""};
  (store.get("days") || []).forEach(s => { const [y, m, d] = s.split("-").map(Number); if (y) SK.days[dk(new Date(y, m - 1, d))] = "g"; });
}
const saveSK = () => store.set("streak2", SK);
const xpOn = k => SK.xp[k] || 0;
function curStreak(){
  let k = today(); if (!SK.days[k]) k = dShift(k, -1);
  let n = 0; while (SK.days[k]){ if (SK.days[k] === "g") n++; k = dShift(k, -1); }
  return n;
}
// À l'ouverture : les jours manqués sont couverts par les gels de série en réserve, sinon la série repart de zéro.
function settleStreak(){
  const t = today(), y = dShift(t, -1);
  if (SK.days[y] || SK.days[t]) return;
  let k = dShift(y, -1), gap = [y];
  while (!SK.days[k] && gap.length < 400) { gap.push(k); k = dShift(k, -1); }
  if (!SK.days[k]) return;                       // jamais eu de série
  if (gap.length <= SK.frz){ gap.forEach(g => SK.days[g] = "f"); SK.frz -= gap.length; SK.usedFrz = gap.length; SK.usedSeen = ""; }
  else { let n = 0, j = k; while (SK.days[j]){ if (SK.days[j] === "g") n++; j = dShift(j, -1); } SK.lost = n; SK.lostSeen = ""; }
  saveSK();
}
function addXP(n){
  const k = today(), before = xpOn(k);
  SK.xp[k] = before + n;
  Object.keys(SK.xp).forEach(d => { if (d < dShift(k, -120)) delete SK.xp[d]; });
  let won = null;
  if (before < SK.goal && before + n >= SK.goal){
    SK.days[k] = "g";
    const s = curStreak(); SK.best = Math.max(SK.best, s);
    let frz = false;
    if (s > 0 && s % 7 === 0 && SK.frzKey !== k && SK.frz < 2){ SK.frz++; SK.frzKey = k; frz = true; }
    won = {s, frz};
  }
  saveSK(); refreshStreak(true);
  xpPop(n);
  if (won){ setTimeout(() => celebrate(won.s, won.frz), 900); checkAch(); }
}

/* ==========================================================================
   Étape 4 (suite) : des formats variés dans le Flash, tirés du contenu existant
   - Vrai ou faux (questions des quiz)   - Devine où (globe miniature)
   - Le chiffre (chiffres clés des « dessous »)   - Qui gagne, qui perd (court)
   ========================================================================== */
const placesOf = it => (it.k === "c" ? it.c.countries : it.n.places || []).filter(id => COUNTRY[id]);
let tqLast = "";
teaserFor = it => {
  const fk = itemKey(it), qs = QUIZ[fk] || [], ds = DESSOUS && DESSOUS[fk], pl = placesOf(it);
  const opts = [];
  if (qs.length){ opts.push("qcm", "vf"); }
  if (pl.length) opts.push("geo");
  if (ds && ds.keys && ds.keys.length) opts.push("chiffre");
  if (ds && ds.win && ds.lose && ds.win.length && ds.lose.length) opts.push("ds");
  const pool = opts.filter(m => m !== tqLast); if (!pool.length) return null;
  const mode = shuffle(pool)[0]; tqLast = mode;
  const base = {k:"t", key:"tq:" + fk, fk, mode};
  if (mode === "qcm"){
    const nums = qs.filter(q => hasNum(q[1]) && q.slice(1, 5).every(hasNum)), pickN = nums.length && Math.random() < .5, q = shuffle(pickN ? nums : qs)[0];
    return {...base, mode:undefined, num:pickN, q:q[0], good:q[1], why:q[5], opts:shuffle(q.slice(1, 5))};
  }
  if (mode === "vf"){
    const q = shuffle(qs)[0], truth = Math.random() < .5, shown = truth ? q[1] : shuffle(q.slice(2, 5))[0];
    return {...base, q:q[0], prop:shown, real:q[1], opts:["Vrai", "Faux"], good:truth ? "Vrai" : "Faux"};
  }
  if (mode === "geo"){
    const id = pl[0], c = COUNTRY[id];

    const i = grp.indexOf(n);

    NOTIONS.filter(x => x.ready && x.sec === n.sec && x.group !== n.group).forEach(x => push(x.t));

{

let TASTE = store.get("taste") || {sec:{}, grp:{}, n:0};

let tsView = null;
function tsBegin(){
  const it = FEED[fdCur];
  if (!it || (it.k !== "n" && it.k !== "c") || fdIsFav){ tsView = null; return; }
  const key = itemKey(it);
  tsView = {i:fdCur, it, key, t:Date.now(), fav:FAV.has(key), deep:DEEP.has(key), quiz:!!QRES[key], bottom:false};
  const p = cardEl(fdCur)?.querySelector(".pane.p0");
  if (p){
    const chk = () => { if (tsView && tsView.i === +p.closest(".fc").dataset.i && p.scrollTop + p.clientHeight >= p.scrollHeight - 40) tsView.bottom = true; };
    if (!p.dataset.ts){ p.dataset.ts = 1; p.addEventListener("scroll", chk, {passive:true}); }

  if (sec < 3) s = -1;                                  // zappée
  else if (ratio < .3 && !v.bottom) s = -.3;            // survolée
  else if (ratio >= .6 || v.bottom === true) s = 1;     // lue
  else s = .3;

  if (!v.fav && FAV.has(v.key)) s += 2;                 // gardée
